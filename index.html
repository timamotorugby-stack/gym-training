      if (groups === 1) {
        menuList.innerHTML = list.map((id, index) => menuCard(id, index)).join("");
        return;
      }
      menuList.innerHTML = Array.from({ length: groups }, (_, group) => {
        const cards = list.slice(group * 5, group * 5 + 5).map((id, offset) => menuCard(id, group * 5 + offset)).join("");
        return `<h3 class="set-heading">${group + 1}セット目</h3>${cards}`;
      }).join("");
    }

    function renderSession() {
      renderClocks();
      renderLibrary("timer");
      renderWorkoutActions("timer");
      const done = state.session.filter((item) => item.done).length;
      document.getElementById("session-count").textContent = state.session.length
        ? `${done} / ${state.session.length}`
        : "0";
      timerMenu.innerHTML = sessionListHtml(state.session);
    }

    function renderGroups(list, rowHtml, filter) {
      const groups = allParts().map((part) => ({
        part,
        items: list.filter((item) => item.part === part)
      })).filter((group) => group.items.length);
      if (!groups.length) {
        const message = filter === null && state.exercises.length === 0
          ? "種目はまだありません"
          : "この部位の種目はありません";
        return `<p class="empty-copy">${message}</p>`;
      }
      return groups.map((group) => `
        <h3 class="group-label" style="color:${colorOf(group.part)}">${esc(group.part)}</h3>
        ${group.items.map(rowHtml).join("")}
      `).join("");
    }

    function renderDb() {
      const preserved = capturePartDraft();
      renderChips(dbFilters, state.dbFilter, "data-filter");
      renderFormParts(preserved);
      const visible = state.dbFilter === null
        ? state.exercises
        : state.exercises.filter((item) => item.part === state.dbFilter);
      dbList.innerHTML = renderGroups(visible, (item) => {
        const note = item.note ? `<p>${esc(item.note)}</p>` : "";
        const actions = state.deleteArmed === item.id
          ? `<button type="button" class="text-btn danger" data-delete="${item.id}">削除する</button><button type="button" class="text-btn" data-cancel-delete>やめる</button>`
          : `<button type="button" class="text-btn" data-edit="${item.id}">編集</button><button type="button" class="text-btn" data-arm="${item.id}">削除</button>`;
        return `<article class="ex-row">
          <i class="dot" style="background:${colorOf(item.part)}"></i>
          <div><h3>${esc(item.name)}</h3>${note}</div>
          <div class="row-actions">${actions}</div>
        </article>`;
      }, state.dbFilter);
    }

    function renderPicker() {
      const appending = state.pickerMode === "timer" || state.pickerMode === "free";
      pickerTitle.textContent = appending ? "末尾に追加" : `${state.pickerSlot + 1}種目目を選ぶ`;
      renderChips(pickerFilters, state.pickerFilter, "data-pick-filter");
      const selected = state.pickerMode === "timer" ? state.session : state.free;
      const counts = appending
        ? selectionCounts(selected.map((item) => item.exerciseId))
        : selectionCounts(currentMenu(), state.pickerSlot);
      const visible = state.pickerFilter === null
        ? state.exercises
        : state.exercises.filter((item) => item.part === state.pickerFilter);
      pickerList.innerHTML = renderGroups(visible, (item) => {
        const count = counts.get(item.id) || 0;
        const taken = count >= 2;
        const hint = taken ? "2回選択中" : count === 1 ? "もう1回選べます" : "";
        return `<button type="button" class="pick" data-choose="${item.id}" ${taken ? "disabled" : ""}>
          <span>${esc(item.name)}</span>
          ${hint ? `<small>${hint}</small>` : ""}
        </button>`;
      }, state.pickerFilter);
    }

    function isCounting() {
      const phase = state.timer.phase;
      return phase === "work" || phase === "rest" || phase === "simple";
    }

    function readSimpleSeconds() {
      let minutes = readNumber(simpleMinInput, 0, 60, 0);
      let seconds = readNumber(simpleSecInput, 0, 59, 0);
      if (minutes >= 60) {
        minutes = 60;
        seconds = 0;
      }
      return Math.min(3600, Math.max(1, minutes * 60 + seconds));
    }

    function writeSimpleFields(total) {
      const seconds = Math.min(3600, Math.max(1, total));
      simpleMinInput.value = String(Math.floor(seconds / 60));
      simpleSecInput.value = String(seconds % 60);
    }

    function draftSpec() {
      if (state.clockKind === "simple") {
        return { kind: "simple", seconds: readSimpleSeconds(), name: "" };
      }
      return {
        kind: "tabata",
        work: readNumber(workInput, 1, 600, 20),
        rest: readNumber(restInput, 0, 600, 10),
        rounds: readNumber(roundInput, 1, 99, 8),
        name: ""
      };
    }

    function specFromClock(clock) {
      if (clock.kind === "simple") return { kind: "simple", seconds: clock.seconds, name: clock.name };
      return { kind: "tabata", work: clock.work, rest: clock.rest, rounds: clock.rounds, name: clock.name };
    }

    function cloneSpec(spec) {
      return spec.kind === "simple"
        ? { kind: "simple", seconds: spec.seconds, name: spec.name }
        : { kind: "tabata", work: spec.work, rest: spec.rest, rounds: spec.rounds, name: spec.name };
    }

    function plannedSteps() {
      if (state.flow.length) {
        const steps = [];
        for (const id of state.flow) {
          const clock = state.clocks.find((item) => item.id === id);
          if (clock) steps.push(specFromClock(clock));
        }
        if (steps.length) return steps;
      }
      return [draftSpec()];
    }

    function previewSpec() {
      return plannedSteps()[0];
    }

    function displaySpec() {
      const timer = state.timer;
      if (timer.run && timer.phase !== "idle") {
        return timer.run.steps[timer.run.index] || previewSpec();
      }
      return previewSpec();
    }

    function openingMs(spec) {
      return (spec.kind === "simple" ? spec.seconds : spec.work) * 1000;
    }

    function formatSummary(spec) {
      if (spec.kind === "simple") {
        const minutes = Math.floor(spec.seconds / 60);
        const seconds = spec.seconds % 60;
        if (minutes === 0) return `${seconds}秒`;
        return `${minutes}分${String(seconds).padStart(2, "0")}秒`;
      }
      return `${spec.work}秒 / ${spec.rest}秒 × ${spec.rounds}`;
    }

    function usingFlow() {
      return state.flow.some((id) => state.clocks.some((item) => item.id === id));
    }

    function renderTimer() {
      const timer = state.timer;
      const spec = displaySpec();
      const counting = isCounting();
      const steps = timer.run && timer.phase !== "idle" ? timer.run.steps : plannedSteps();
      const stepIndex = timer.run && timer.phase !== "idle" ? timer.run.index : 0;
      const totalSteps = steps.length;
      const phaseName = { idle: "準備", work: "運動", rest: "休憩", simple: "計測", done: "終了" }[timer.phase];
      phaseEl.textContent = phaseName;
      const timeText = timer.phase === "done" ? "終了" : String(Math.max(0, Math.ceil(timer.remainingMs / 1000)));
      timeEl.textContent = timeText;
      timeEl.classList.toggle("is-compact", timeText.length >= 4);
      if (timer.phase === "done") {
        if (totalSteps > 1) roundLabel.textContent = `${totalSteps}件終わりました`;
        else if (spec.kind === "simple") roundLabel.textContent = "終わりました";
        else roundLabel.textContent = `${spec.rounds}セット終わりました`;
      } else if (spec.kind === "simple") {
        roundLabel.textContent = spec.name || "一定時間";
      } else {
        const total = spec.rounds;
        roundLabel.textContent = `セット ${Math.min(timer.round, total)} / ${total}`;
      }
      const showCaption = timer.phase !== "done" && usingFlow() && (totalSteps > 1 || (spec.kind === "tabata" && spec.name));
      flowCaption.hidden = !showCaption;
      if (showCaption) {
        const place = `${stepIndex + 1} / ${totalSteps}`;
        if (spec.kind === "simple") flowCaption.textContent = place;
        else if (totalSteps > 1 && spec.name) flowCaption.textContent = `${spec.name} · ${place}`;
        else flowCaption.textContent = spec.name || place;
      }
      const showDots = spec.kind === "tabata" && spec.rounds <= 12 && timer.phase !== "done";
      roundsEl.hidden = !showDots;
      if (showDots) {
        roundsEl.innerHTML = Array.from({ length: spec.rounds }, (_, index) => {
          const now = index === timer.round - 1 && (counting || timer.phase === "idle");
          const filled = index < timer.round - 1;
          return `<i class="${filled ? "on" : ""} ${now ? "now" : ""}"></i>`;
        }).join("");
      }
      timerEditor.hidden = counting;
      editorLabel.hidden = counting || !usingFlow();
      tabataSettings.hidden = state.clockKind === "simple";
      simpleSettings.hidden = state.clockKind !== "simple";
      document.querySelectorAll("#kind-switch button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.kind === state.clockKind));
      });
      timerCard.classList.toggle("is-work", timer.phase === "work");
      timerCard.classList.toggle("is-rest", timer.phase === "rest");
      timerCard.classList.toggle("is-done", timer.phase === "done");
      timerCard.classList.toggle("is-running", timer.running);
      goBtn.textContent = timer.running ? "一時停止" : timer.phase === "done" ? "もう一度" : "スタート";
      renderClockSave();
    }

    function flashClock(message) {
      state.clockStatus = message;
      state.clockHold = true;
    }

    function closeClockSave() {
      state.clockSave.phase = null;
      state.clockSave.draft = "";
      state.clockSave.error = "";
    }

    function clockDraftName() {
      const input = document.getElementById("clock-name");
      if (input) state.clockSave.draft = input.value;
      return normalize(state.clockSave.draft).slice(0, 24);
    }

    function renderClockSave() {
      if (isCounting()) return;
      const ui = state.clockSave;
      const fieldId = "clock-name";
      const previous = document.getElementById(fieldId);
      const preserve = previous && document.activeElement === previous
        ? { start: previous.selectionStart, end: previous.selectionEnd }
        : null;
      if (preserve) ui.draft = previous.value;
      if (ui.phase === "save" || ui.phase === "overwrite") {
        const error = ui.error ? `<p class="form-error">${esc(ui.error)}</p>` : "";
        const actions = ui.phase === "overwrite"
          ? `<p class="part-note">同じ名前があります</p>
            <button type="button" class="primary" data-clock-overwrite>上書きする</button>
            <button type="button" class="text-btn" data-clock-cancel>やめる</button>`
          : `<button type="button" class="primary" data-clock-commit>保存する</button>
            <button type="button" class="text-btn" data-clock-cancel>やめる</button>`;
        clockSaveEl.innerHTML = `<div class="clock-save">
          <input type="text" id="${fieldId}" maxlength="24" placeholder="インターバル、など" aria-label="タイマー名" autocomplete="off" value="${esc(ui.draft)}">
          ${actions}
          ${error}
        </div>`;
        const next = document.getElementById(fieldId);
        if (state.focusClock && next) {
          state.focusClock = false;
          next.focus();
          const end = next.value.length;
          next.setSelectionRange(end, end);
        } else if (preserve && next) {
          next.focus();
          const end = next.value.length;
          next.setSelectionRange(Math.min(preserve.start ?? end, end), Math.min(preserve.end ?? end, end));
        }
        return;
      }
      clockSaveEl.innerHTML = `<div class="save-row"><button type="button" class="text-btn" data-clock-arm>設定を保存</button></div>`;
    }

    function clockRow(clock, actions) {
      return `<div class="clock-row">
        <div class="body"><strong>${esc(clock.name)}</strong><span class="meta">${esc(formatSummary(specFromClock(clock)))}</span></div>
        ${actions}
      </div>`;
    }

    function clockEditDraft(clock) {
      const seconds = clock.kind === "simple" ? clock.seconds : 60;
      return {
        id: clock.id,
        kind: clock.kind === "simple" ? "simple" : "tabata",
        name: clock.name,
        work: String(clock.kind === "tabata" ? clock.work : 20),
        rest: String(clock.kind === "tabata" ? clock.rest : 10),
        rounds: String(clock.kind === "tabata" ? clock.rounds : 8),
        simpleMin: String(Math.floor(seconds / 60)),
        simpleSec: String(seconds % 60),
        error: ""
      };
    }

    function captureClockEdit() {
      const edit = state.clockEdit;
      const form = document.getElementById("clock-edit-form");
      if (!edit || !form || form.dataset.editId !== edit.id) return null;
      const name = document.getElementById("clock-edit-name");
      const preserve = name && document.activeElement === name
        ? { start: name.selectionStart, end: name.selectionEnd }
        : null;
      if (name) edit.name = name.value;
      const fields = [
        ["clock-edit-work", "work"],
        ["clock-edit-rest", "rest"],
        ["clock-edit-rounds", "rounds"],
        ["clock-edit-min", "simpleMin"],
        ["clock-edit-sec", "simpleSec"]
      ];
      for (const [id, key] of fields) {
        const input = document.getElementById(id);
        if (input) edit[key] = input.value;
      }
      return preserve;
    }

    function finishClockEditFocus(preserve) {
      const nameInput = document.getElementById("clock-edit-name");
      const row = timerClocks.querySelector(".clock-row.is-editing");
      if (!nameInput) return;
      if (state.focusClockEdit) {
        state.focusClockEdit = false;
        nameInput.focus({ preventScroll: true });
        const end = nameInput.value.length;
        nameInput.setSelectionRange(end, end);
        if (row) row.scrollIntoView({ block: "nearest" });
        return;
      }
      if (!preserve) return;
      nameInput.focus({ preventScroll: true });
      const end = nameInput.value.length;
      nameInput.setSelectionRange(
        Math.min(preserve.start ?? end, end),
        Math.min(preserve.end ?? end, end)
      );
    }

    function clockEditHtml(edit) {
      const tabata = edit.kind !== "simple";
      const error = edit.error ? `<p class="form-error">${esc(edit.error)}</p>` : "";
      const settings = tabata
        ? `<div class="timer-settings">
            <label>ワーク<input id="clock-edit-work" type="number" min="1" max="600" inputmode="numeric" value="${esc(edit.work)}"></label>
            <label>レスト<input id="clock-edit-rest" type="number" min="0" max="600" inputmode="numeric" value="${esc(edit.rest)}"></label>
            <label>セット<input id="clock-edit-rounds" type="number" min="1" max="99" inputmode="numeric" value="${esc(edit.rounds)}"></label>
          </div>`
        : `<div class="timer-settings two">
            <label>分<input id="clock-edit-min" type="number" min="0" max="60" inputmode="numeric" value="${esc(edit.simpleMin)}"></label>
            <label>秒<input id="clock-edit-sec" type="number" min="0" max="59" inputmode="numeric" value="${esc(edit.simpleSec)}"></label>
          </div>`;
      return `<div class="clock-row is-editing">
        <div class="clock-edit" id="clock-edit-form" data-edit-id="${esc(edit.id)}">
          <input type="text" id="clock-edit-name" maxlength="24" aria-label="タイマー名" autocomplete="off" value="${esc(edit.name)}">
          <div class="kind-switch" role="group" aria-label="タイマーの種類">
            <button type="button" data-edit-kind="tabata" aria-pressed="${tabata ? "true" : "false"}">タバタ</button>
            <button type="button" data-edit-kind="simple" aria-pressed="${tabata ? "false" : "true"}">一定時間</button>
          </div>
          ${settings}
          <div class="edit-actions">
            <button type="button" class="primary" data-clock-edit-save>保存する</button>
            <button type="button" class="text-btn" data-clock-edit-cancel>やめる</button>
          </div>
          ${error}
        </div>
      </div>`;
    }

    function renderClocks() {
      if (!timerClocks || !clockStatusEl) return;
      const preserve = captureClockEdit();
      if (state.clockEdit && !state.clocks.some((item) => item.id === state.clockEdit.id)) state.clockEdit = null;
      const ui = state.clockUi;
      if ((ui.phase === "delete" || ui.phase === "confirm-delete") && !state.clocks.length) {
        ui.phase = null;
        ui.deleteId = null;
      } else if (ui.phase === "confirm-delete" && !state.clocks.some((item) => item.id === ui.deleteId)) {
        ui.phase = "delete";
        ui.deleteId = null;
      }
      if (state.clockHold) state.clockHold = false;
      else state.clockStatus = "";
      clockStatusEl.textContent = state.clockStatus;
      const counting = isCounting();
      const steps = state.timer.run && state.timer.phase !== "idle" ? state.timer.run.steps : plannedSteps();
      const currentIndex = counting ? (state.timer.run ? state.timer.run.index : 0) : -1;
      if (!state.clocks.length && !state.flow.length) {
        state.clockEdit = null;
        timerClocks.innerHTML = "";
        return;
      }
      let saved = "";
      if (state.clocks.length) {
        let head = "";
        if (ui.phase === "confirm-delete") {
          const clock = state.clocks.find((item) => item.id === ui.deleteId);
          const used = clock && state.flow.includes(clock.id);
          head = `<p class="clock-hint">『${esc(clock.name)}』を削除します。${used ? "この順番からも外れます。" : ""}</p>
            <button type="button" class="text-btn danger" data-clock-confirm-delete>削除する</button>
            <button type="button" class="text-btn" data-clock-cancel>やめる</button>`;
        } else if (ui.phase === "delete") {
          head = `<p class="clock-hint">削除するタイマーを選んでください</p>
            <button type="button" class="text-btn" data-clock-cancel>やめる</button>`;
        } else {
          head = `<div class="clock-top"><h2>保存したタイマー</h2>
            ${counting ? "" : `<button type="button" class="text-btn" data-clock-arm-delete>削除</button>`}</div>`;
        }
        const hint = state.flow.length || ui.phase === "delete" || ui.phase === "confirm-delete"
          ? ""
          : `<p class="clock-hint">追加した順に計測します。</p>`;
        const rows = state.clocks.map((clock) => {
          if (state.clockEdit && state.clockEdit.id === clock.id) return clockEditHtml(state.clockEdit);
          if (ui.phase === "delete" || ui.phase === "confirm-delete") {
            const on = ui.phase === "confirm-delete" && ui.deleteId === clock.id;
            return `<button type="button" class="clock-row" data-clock-pick="${esc(clock.id)}" aria-pressed="${on}">
              <div class="body"><strong>${esc(clock.name)}</strong><span class="meta">${esc(formatSummary(specFromClock(clock)))}</span></div>
            </button>`;
          }
          if (counting) return clockRow(clock, "");
          return clockRow(clock, `<div class="clock-actions"><button type="button" class="text-btn" data-clock-edit="${esc(clock.id)}">編集</button><button type="button" class="text-btn" data-clock-add="${esc(clock.id)}">追加</button></div>`);
        }).join("");
        saved = `<section class="clock-block">${head}${hint}${rows}</section>`;
      }
      let flow = "";
      if (state.flow.length) {
        const rows = state.flow.map((id, index) => {
          const clock = state.clocks.find((item) => item.id === id);
          if (!clock) return "";
          const current = index === currentIndex;
          const actions = counting ? "" : `<div class="clock-actions">
            ${index > 0 ? `<button type="button" class="text-btn" data-clock-up="${index}">上へ</button>` : ""}
            ${index < state.flow.length - 1 ? `<button type="button" class="text-btn" data-clock-down="${index}">下へ</button>` : ""}
            <button type="button" class="text-btn" data-clock-remove="${index}">外す</button>
          </div>`;
          return `<div class="clock-row${current ? " is-current" : ""}" data-flow-index="${index}">
            <div class="clock-ord">${index + 1}</div>
            <div class="body"><strong>${esc(clock.name)}</strong><span class="meta">${esc(formatSummary(specFromClock(clock)))}</span></div>
            ${actions}
          </div>`;
        }).join("");
        flow = `<section class="clock-block"><div class="clock-top"><h2>この順で計測</h2></div>${rows}</section>`;
      }
      timerClocks.innerHTML = saved + flow;
      finishClockEditFocus(preserve);
    }

    function markFlowCurrent() {
      if (!timerClocks) return;
      const currentIndex = isCounting() && state.timer.run ? state.timer.run.index : -1;
      timerClocks.querySelectorAll("[data-flow-index]").forEach((row) => {
        row.classList.toggle("is-current", Number(row.dataset.flowIndex) === currentIndex);
      });
    }

    function beginClockEdit(id) {
      if (isCounting()) return;
      const clock = state.clocks.find((item) => item.id === id);
      if (!clock) return;
      state.clockUi.phase = null;
      state.clockUi.deleteId = null;
      state.clockEdit = clockEditDraft(clock);
      state.focusClockEdit = true;
      refreshClocks();
    }

    function editSeconds(edit) {
      let minutes = readStoredNumber(edit.simpleMin, 0, 60, 0);
      let seconds = readStoredNumber(edit.simpleSec, 0, 59, 0);
      if (minutes >= 60) {
        minutes = 60;
        seconds = 0;
      }
      return Math.min(3600, Math.max(1, minutes * 60 + seconds));
    }

    function commitClockEdit() {
      const edit = state.clockEdit;
      if (!edit) return;
      captureClockEdit();
      const name = normalize(edit.name).slice(0, 24);
      const showError = (message) => {
        edit.error = message;
        state.focusClockEdit = true;
        refreshClocks();
      };
      if (!name) {
        showError("名前を入力してください");
        return;
      }
      const index = state.clocks.findIndex((item) => item.id === edit.id);
      if (index < 0) {
        state.clockEdit = null;
        refreshClocks();
        return;
      }
      if (state.clocks.some((item) => item.name === name && item.id !== edit.id)) {
        showError("同じ名前があります");
        return;
      }
      const previous = state.clocks[index];
      const clock = edit.kind === "simple"
        ? { id: edit.id, name, kind: "simple", seconds: editSeconds(edit) }
        : {
          id: edit.id,
          name,
          kind: "tabata",
          work: readStoredNumber(edit.work, 1, 600, 20),
          rest: readStoredNumber(edit.rest, 0, 600, 10),
          rounds: readStoredNumber(edit.rounds, 1, 99, 8)
        };
      state.clocks[index] = clock;
      if (!saveClockStore()) {
        state.clocks[index] = previous;
        showError("保存できませんでした");
        return;
      }
      state.clockEdit = null;
      if (state.timer.phase === "idle") state.timer.remainingMs = openingMs(previewSpec());
      flashClock(`${name}を保存しました`);
      refreshClocks();
    }

    function refreshClocks() {
      renderClocks();
      renderTimer();
    }

    function commitClock(overwrite) {
      const ui = state.clockSave;
      const name = clockDraftName();
      const showError = (message) => {
        ui.error = message;
        ui.phase = "save";
        state.focusClock = true;
        renderClockSave();
      };
      if (!name) {
        showError("名前を入力してください");
        return;
      }
      const existingIndex = state.clocks.findIndex((item) => item.name === name);
      if (existingIndex >= 0 && !overwrite) {
        ui.phase = "overwrite";
        ui.error = "";
        renderClockSave();
        return;
      }
      if (existingIndex < 0 && state.clocks.length >= 30) {
        showError("30件まで保存できます");
        return;
      }
      const spec = draftSpec();
      const previous = existingIndex >= 0 ? state.clocks[existingIndex] : null;
      const clock = spec.kind === "simple"
        ? { id: previous ? previous.id : newLibraryId(), name, kind: "simple", seconds: spec.seconds }
        : { id: previous ? previous.id : newLibraryId(), name, kind: "tabata", work: spec.work, rest: spec.rest, rounds: spec.rounds };
      if (existingIndex >= 0) state.clocks[existingIndex] = clock;
      else state.clocks.push(clock);
      closeClockSave();
      if (!saveClockStore()) {
        if (existingIndex >= 0) state.clocks[existingIndex] = previous;
        else state.clocks.pop();
        ui.phase = "save";
        ui.draft = name;
        ui.error = "保存できませんでした";
        state.focusClock = true;
        refreshClocks();
        return;
      }
      flashClock(`${name}を保存しました`);
      refreshClocks();
    }

    function saveClockStore() {
      const before = state.timer.phase;
      saveTimer();
      const timerStatus = document.getElementById("timer-status");
      return before === state.timer.phase && timerStatus && timerStatus.hidden;
    }

    function deleteClock() {
      const ui = state.clockUi;
      const index = state.clocks.findIndex((item) => item.id === ui.deleteId);
      if (index < 0) {
        ui.phase = null;
        ui.deleteId = null;
        refreshClocks();
        return;
      }
      const [removed] = state.clocks.splice(index, 1);
      const previousFlow = state.flow.slice();
      state.flow = state.flow.filter((id) => id !== removed.id);
      ui.phase = null;
      ui.deleteId = null;
      if (!saveClockStore()) {
        state.clocks.splice(index, 0, removed);
        state.flow = previousFlow;
        ui.phase = "confirm-delete";
        ui.deleteId = removed.id;
        refreshClocks();
        return;
      }
      if (state.timer.phase === "idle") state.timer.remainingMs = openingMs(previewSpec());
      flashClock(`${removed.name}を削除しました`);
      refreshClocks();
    }

    function showMode(mode) {
      const changed = state.mode !== mode;
      if (changed) {
        state.actionArmed = null;
        closeLibraryEditors("menu");
        closeLibraryEditors("timer");
        state.libraryStatus.menu = "";
        state.libraryStatus.timer = "";
        state.libraryHold = null;
      }
      state.mode = mode;
      lead.textContent = mode === "menu" ? menuLead() : LEADS[mode];
      for (const name of ["menu", "db", "timer"]) {
        const tab = document.getElementById(`tab-${name}`);
        const panel = document.getElementById(`panel-${name}`);
        const on = name === mode;
        tab.setAttribute("aria-selected", String(on));
        panel.hidden = !on;
      }
      if (changed) {
        renderMenu();
        renderSession();
      }
      window.scrollTo(0, 0);
    }

    function releaseExercise(id) {
      for (const [shape, list] of Object.entries(state.menus)) {
        list.forEach((current, index) => {
          if (current === id) {
            list[index] = null;
            clearSlotChecks(shape, index);
          }
        });
      }
      state.session = state.session.filter((item) => item.exerciseId !== id);
      state.free = state.free.filter((item) => item.exerciseId !== id);
      if (stripExerciseFromLibrary(id)) saveLibrary();
    }

    function resetForm() {
      const partInput = document.getElementById("part-name");
      if (partInput && state.addingPart) state.partDraft = partInput.value;
      state.editingId = null;
      state.formPart = "胸";
      state.partDeleteArmed = false;
      form.reset();
      formTitle.textContent = "種目を追加";
      saveBtn.textContent = "登録する";
      cancelEdit.hidden = true;
      formError.hidden = true;
      renderFormParts(null);
    }

    function startEdit(id) {
      const exercise = exerciseById(id);
      if (!exercise) return;
      state.editingId = id;
      state.formPart = exercise.part;
      state.deleteArmed = null;
      state.partDeleteArmed = false;
      nameInput.value = exercise.name;
      noteInput.value = exercise.note;
      formTitle.textContent = "種目を編集";
      saveBtn.textContent = "保存する";
      cancelEdit.hidden = false;
      formError.hidden = true;
      dbStatus.textContent = "";
      renderDb();
      form.scrollIntoView({ block: "nearest" });
      nameInput.focus();
    }

    function commitPart() {
      capturePartDraft();
      const name = normalize(state.partDraft).slice(0, 16);
      if (!name) {
        state.partError = "部位名を入力してください";
        state.focusPart = true;
        renderDb();
        return;
      }
      if (name === "すべて") {
        state.partError = "すべて、という名前は使えません";
        state.focusPart = true;
        renderDb();
        return;
      }
      if (allParts().includes(name)) {
        state.partError = "同じ部位があります";
        state.focusPart = true;
        renderDb();
        return;
      }
      state.customParts.push({ name, color: nextColor() });
      state.formPart = name;
      state.addingPart = false;
      state.partDraft = "";
      state.partError = "";
      state.partDeleteArmed = false;
      state.focusName = true;
      dbStatus.textContent = `${name}を追加しました`;
      saveParts();
      renderDb();
    }

    function deletePart() {
      const name = state.formPart;
      if (!isCustomPart(name)) return;
      const removedIds = new Set();
      for (const exercise of state.exercises) {
        if (exercise.part !== name) continue;
        removedIds.add(exercise.id);
        releaseExercise(exercise.id);
      }
      const editingRemoved = Boolean(state.editingId && removedIds.has(state.editingId));
      state.exercises = state.exercises.filter((item) => item.part !== name);
      state.customParts = state.customParts.filter((item) => item.name !== name);
      if (state.dbFilter === name) state.dbFilter = null;
      if (state.pickerFilter === name) state.pickerFilter = null;
      if (state.deleteArmed && removedIds.has(state.deleteArmed)) state.deleteArmed = null;
      if (editingRemoved) {
        resetForm();
      } else if (state.editingId) {
        const editing = exerciseById(state.editingId);
        state.formPart = editing ? editing.part : "胸";
        state.partDeleteArmed = false;
      } else {
        state.formPart = "胸";
        state.partDeleteArmed = false;
      }
      dbStatus.textContent = `${name}を削除しました`;
      if (saveExercises()) {
        saveParts();
        saveMenu();
        saveTimer();
      }
      renderDb();
      renderMenu();
      renderSession();
      if (picker.open) renderPicker();
    }

    function filterValue(button) {
      if (button.hasAttribute("data-all")) return null;
      return button.getAttribute("data-filter") ?? button.getAttribute("data-pick-filter");
    }

    document.querySelector(".tabs").addEventListener("click", (event) => {
      const tab = event.target.closest("[role='tab']");
      if (!tab) return;
      showMode(tab.id.replace("tab-", ""));
    });

    function bindLibrary(mode) {
      const actions = document.getElementById(mode === "menu" ? "menu-actions" : "timer-actions");
      const library = document.getElementById(mode === "menu" ? "menu-library" : "timer-library");
      actions.addEventListener("click", (event) => {
        if (event.target.closest("[data-library-commit], [data-library-overwrite], [data-library-cancel]")) {
          onLibraryClick(mode, event);
          return;
        }
        onWorkoutAction(mode, event);
      });
      actions.addEventListener("input", (event) => onLibraryInput(mode, event));
      actions.addEventListener("compositionend", (event) => onLibraryCompositionEnd(mode, event));
      actions.addEventListener("keydown", (event) => onLibraryKeydown(mode, event));
      library.addEventListener("click", (event) => onLibraryClick(mode, event));
    }

    bindLibrary("menu");
    bindLibrary("timer");

    document.getElementById("shape-switch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-shape]");
      if (!button || button.dataset.shape === state.menuShape) return;
      state.menuShape = button.dataset.shape;
      state.actionArmed = null;
      if (state.mode === "menu") lead.textContent = menuLead();
      saveMenu();
      renderMenu();
    });

    document.getElementById("ten-repeat").addEventListener("click", (event) => {
      const button = event.target.closest("[data-repeat]");
      if (!button || state.menuShape !== "ten") return;
      const next = button.dataset.repeat === "1" ? 1 : 0;
      if (next === state.tenRepeat) return;
      const previous = state.tenRepeat === 1 ? 1 : 0;
      state.tenRepeat = next;
      for (let offset = 0; offset < 5; offset += 1) {
        delete state.checks[checkKey("ten", previous * 5 + offset, 1)];
      }
      state.actionArmed = null;
      saveMenu();
      renderMenu();
    });

    menuList.addEventListener("click", (event) => {
      if (isFreeMenu()) {
        const remove = event.target.closest("[data-remove]");
        if (remove) {
          state.free = state.free.filter((item) => item.key !== remove.dataset.remove);
          saveMenu();
          renderMenu();
          return;
        }
        const row = event.target.closest("[data-session]");
        if (!row) return;
        const item = state.free.find((entry) => entry.key === row.dataset.session);
        if (!item) return;
        item.done = !item.done;
        saveMenu();
        renderMenu();
        return;
      }
      const check = event.target.closest("[data-check]");
      if (check) {
        state.checks[check.dataset.check] = !state.checks[check.dataset.check];
        saveMenu();
        renderMenu();
        return;
      }
      const pick = event.target.closest("[data-pick]");
      if (pick) openPicker(Number(pick.dataset.pick));
    });

    timerMenu.addEventListener("click", (event) => {
      const remove = event.target.closest("[data-remove]");
      if (remove) {
        state.session = state.session.filter((item) => item.key !== remove.dataset.remove);
        saveTimer();
        renderSession();
        return;
      }
      const row = event.target.closest("[data-session]");
      if (!row) return;
      const item = state.session.find((entry) => entry.key === row.dataset.session);
      if (!item) return;
      item.done = !item.done;
      saveTimer();
      renderSession();
    });

    function openPicker(slot) {
      state.pickerMode = "menu";
      state.pickerSlot = slot;
      state.pickerFilter = null;
      renderPicker();
      picker.showModal();
    }

    document.getElementById("add-session").addEventListener("click", () => {
      state.pickerMode = "timer";
      state.pickerSlot = null;
      state.pickerFilter = null;
      renderPicker();
      picker.showModal();
    });

    document.getElementById("add-free").addEventListener("click", () => {
      state.pickerMode = "free";
      state.pickerSlot = null;
      state.pickerFilter = null;
      renderPicker();
      picker.showModal();
    });

    document.getElementById("close-picker").addEventListener("click", () => picker.close());
    picker.addEventListener("click", (event) => {
      if (event.target === picker) picker.close();
    });

    pickerFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-pick-filter], [data-all]");
      if (!button) return;
      state.pickerFilter = filterValue(button);
      renderPicker();
    });

    pickerList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-choose]");
      if (!button || button.disabled) return;
      const id = button.dataset.choose;
      if (state.pickerMode === "timer" || state.pickerMode === "free") {
        const list = state.pickerMode === "timer" ? state.session : state.free;
        const counts = selectionCounts(list.map((item) => item.exerciseId));
        if ((counts.get(id) || 0) >= 2) return;
        list.push({ key: newSessionKey(), exerciseId: id, done: false });
        if (state.pickerMode === "timer") {
          saveTimer();
          picker.close();
          renderSession();
        } else {
          saveMenu();
          picker.close();
          renderMenu();
        }
        return;
      }
      const slot = state.pickerSlot;
      const list = currentMenu();
      const counts = selectionCounts(list, slot);
      if ((counts.get(id) || 0) >= 2) return;
      if (list[slot] !== id) {
        list[slot] = id;
        clearSlotChecks(state.menuShape, slot);
        saveMenu();
      }
      picker.close();
      renderMenu();
    });

    dbFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-filter], [data-all]");
      if (!button) return;
      state.dbFilter = filterValue(button);
      renderDb();
    });

    formParts.addEventListener("click", (event) => {
      const add = event.target.closest("[data-add-part]");
      if (add) {
        state.addingPart = true;
        state.partDraft = "";
        state.partError = "";
        state.partDeleteArmed = false;
        state.focusPart = true;
        renderFormParts(null);
        return;
      }
      const button = event.target.closest("[data-part]");
      if (!button) return;
      const preserved = capturePartDraft();
      state.formPart = button.getAttribute("data-part");
      state.partDeleteArmed = false;
      renderFormParts(preserved);
    });

    partExtra.addEventListener("click", (event) => {
      if (event.target.closest("[data-commit-part]")) {
        commitPart();
        return;
      }
      if (event.target.closest("[data-cancel-part]")) {
        state.addingPart = false;
        state.partDraft = "";
        state.partError = "";
        renderFormParts(null);
        return;
      }
      if (event.target.closest("[data-arm-part]")) {
        const preserved = capturePartDraft();
        state.partDeleteArmed = true;
        renderFormParts(preserved);
        return;
      }
      if (event.target.closest("[data-cancel-part-delete]")) {
        const preserved = capturePartDraft();
        state.partDeleteArmed = false;
        renderFormParts(preserved);
        return;
      }
      if (event.target.closest("[data-delete-part]")) deletePart();
    });

    partExtra.addEventListener("compositionend", (event) => {
      if (!event.target || event.target.id !== "part-name") return;
      ignorePartEnter = true;
      setTimeout(() => { ignorePartEnter = false; }, 0);
    });

    partExtra.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.target.id !== "part-name") return;
      if (event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      if (ignorePartEnter) return;
      commitPart();
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        formError.textContent = "種目名を入力してください";
        formError.hidden = false;
        nameInput.focus();
        return;
      }
      formError.hidden = true;
      const note = noteInput.value.trim();
      if (state.editingId) {
        const exercise = exerciseById(state.editingId);
        exercise.name = name;
        exercise.part = state.formPart;
        exercise.note = note;
        dbStatus.textContent = `${name}を保存しました`;
      } else {
        state.exercises.push({ id: newExerciseId(), name, part: state.formPart, note });
        dbStatus.textContent = `${name}を登録しました`;
        if (state.dbFilter !== null && state.dbFilter !== state.formPart) state.dbFilter = state.formPart;
      }
      saveExercises();
      resetForm();
      renderDb();
      renderMenu();
      renderSession();
    });

    cancelEdit.addEventListener("click", () => {
      resetForm();
      dbStatus.textContent = "";
    });

    dbList.addEventListener("click", (event) => {
      const edit = event.target.closest("[data-edit]");
      if (edit) {
        startEdit(edit.dataset.edit);
        return;
      }
      const arm = event.target.closest("[data-arm]");
      if (arm) {
        state.deleteArmed = arm.dataset.arm;
        renderDb();
        return;
      }
      if (event.target.closest("[data-cancel-delete]")) {
        state.deleteArmed = null;
        renderDb();
        return;
      }
      const remove = event.target.closest("[data-delete]");
      if (!remove) return;
      const id = remove.dataset.delete;
      const exercise = exerciseById(id);
      state.exercises = state.exercises.filter((item) => item.id !== id);
      releaseExercise(id);
      state.deleteArmed = null;
      if (state.editingId === id) resetForm();
      dbStatus.textContent = exercise ? `${exercise.name}を削除しました` : "";
      if (saveExercises()) {
        saveMenu();
        saveTimer();
      }
      renderDb();
      renderMenu();
      renderSession();
    });

    function stopTimer() {
      clearInterval(timerHandle);
      timerHandle = null;
      state.timer.running = false;
    }

    function finishTimer() {
      state.timer.phase = "done";
      state.timer.remainingMs = 0;
      stopTimer();
    }

    function beginCurrent() {
      const timer = state.timer;
      const spec = timer.run.steps[timer.run.index];
      timer.round = 1;
      if (spec.kind === "simple") {
        timer.phase = "simple";
        timer.remainingMs = spec.seconds * 1000;
      } else {
        timer.phase = "work";
        timer.remainingMs = spec.work * 1000;
      }
      endsAt = Date.now() + timer.remainingMs;
    }

    function advanceFlow() {
      const timer = state.timer;
      if (timer.run.index + 1 >= timer.run.steps.length) {
        finishTimer();
        return;
      }
      timer.run.index += 1;
      beginCurrent();
    }

    function advancePhase() {
      const timer = state.timer;
      const spec = timer.run.steps[timer.run.index];
      if (timer.phase === "simple") {
        advanceFlow();
        return;
      }
      if (timer.phase === "work") {
        if (timer.round >= spec.rounds) {
          advanceFlow();
          return;
        }
        if (spec.rest === 0) {
          timer.round += 1;
          timer.phase = "work";
          timer.remainingMs = spec.work * 1000;
          endsAt = Date.now() + timer.remainingMs;
          return;
        }
        timer.phase = "rest";
        timer.remainingMs = spec.rest * 1000;
        endsAt = Date.now() + timer.remainingMs;
        return;
      }
      if (timer.round >= spec.rounds) {
        advanceFlow();
        return;
      }
      timer.round += 1;
      timer.phase = "work";
      timer.remainingMs = spec.work * 1000;
      endsAt = Date.now() + timer.remainingMs;
    }

    function tick() {
      state.timer.remainingMs = Math.max(0, endsAt - Date.now());
      if (state.timer.remainingMs <= 0) advancePhase();
      renderTimer();
      if (state.clockEdit) markFlowCurrent();
      else renderClocks();
    }

    goBtn.addEventListener("click", () => {
      const timer = state.timer;
      if (timer.running) {
        timer.remainingMs = Math.max(0, endsAt - Date.now());
        stopTimer();
        renderTimer();
        renderClocks();
        return;
      }
      if (timer.phase === "done" || timer.phase === "idle") {
        timer.run = { steps: plannedSteps().map(cloneSpec), index: 0 };
        state.clockUi.phase = null;
        state.clockUi.deleteId = null;
        beginCurrent();
      }
      timer.running = true;
      endsAt = Date.now() + timer.remainingMs;
      clearInterval(timerHandle);
      timerHandle = setInterval(tick, 200);
      renderTimer();
      renderClocks();
    });

    document.getElementById("reset").addEventListener("click", () => {
      stopTimer();
      state.timer.phase = "idle";
      state.timer.round = 1;
      state.timer.run = null;
      state.timer.remainingMs = openingMs(previewSpec());
      renderTimer();
      renderClocks();
    });

    function applyTimerSettings() {
      if (state.timer.phase === "idle") state.timer.remainingMs = openingMs(previewSpec());
      saveTimer();
      renderTimer();
      renderLibrary("timer");
    }

    [workInput, restInput, roundInput].forEach((input) => {
      input.addEventListener("input", applyTimerSettings);
      input.addEventListener("change", () => {
        const limits = input === restInput ? [0, 600, 10] : input === roundInput ? [1, 99, 8] : [1, 600, 20];
        input.value = String(readNumber(input, limits[0], limits[1], limits[2]));
        applyTimerSettings();
      });
    });

    [simpleMinInput, simpleSecInput].forEach((input) => {
      input.addEventListener("input", applyTimerSettings);
      input.addEventListener("change", () => {
        writeSimpleFields(readSimpleSeconds());
        applyTimerSettings();
      });
    });

    document.getElementById("kind-switch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-kind]");
      if (!button || button.dataset.kind === state.clockKind) return;
      state.clockKind = button.dataset.kind === "simple" ? "simple" : "tabata";
      applyTimerSettings();
    });

    function onClockClick(event) {
      if (event.target.closest("[data-clock-edit-save]")) {
        commitClockEdit();
        return;
      }
      if (event.target.closest("[data-clock-edit-cancel]")) {
        state.clockEdit = null;
        refreshClocks();
        return;
      }
      const editKind = event.target.closest("[data-edit-kind]");
      if (editKind && state.clockEdit) {
        const next = editKind.dataset.editKind === "simple" ? "simple" : "tabata";
        if (next === state.clockEdit.kind) return;
        captureClockEdit();
        state.clockEdit.kind = next;
        state.clockEdit.error = "";
        refreshClocks();
        return;
      }
      const editButton = event.target.closest("[data-clock-edit]");
      if (editButton) {
        beginClockEdit(editButton.dataset.clockEdit);
        return;
      }
      if (event.target.closest("[data-clock-arm]")) {
        state.clockSave.phase = "save";
        state.clockSave.error = "";
        state.focusClock = true;
        renderClockSave();
        return;
      }
      if (event.target.closest("[data-clock-cancel]")) {
        closeClockSave();
        state.clockUi.phase = null;
        state.clockUi.deleteId = null;
        refreshClocks();
        return;
      }
      if (event.target.closest("[data-clock-commit]")) {
        commitClock(false);
        return;
      }
      if (event.target.closest("[data-clock-overwrite]")) {
        commitClock(true);
        return;
      }
      if (event.target.closest("[data-clock-arm-delete]")) {
        if (isCounting()) return;
        closeClockSave();
        state.clockEdit = null;
        state.clockUi.phase = "delete";
        state.clockUi.deleteId = null;
        refreshClocks();
        return;
      }
      if (event.target.closest("[data-clock-confirm-delete]")) {
        deleteClock();
        return;
      }
      const pick = event.target.closest("[data-clock-pick]");
      if (pick) {
        state.clockUi.phase = "confirm-delete";
        state.clockUi.deleteId = pick.dataset.clockPick;
        refreshClocks();
        return;
      }
      if (isCounting()) return;
      const add = event.target.closest("[data-clock-add]");
      if (add) {
        if (state.flow.length >= 12) {
          flashClock("12件までつなげられます");
          refreshClocks();
          return;
        }
        state.flow.push(add.dataset.clockAdd);
        if (state.timer.phase === "idle") state.timer.remainingMs = openingMs(previewSpec());
        saveTimer();
        refreshClocks();
        return;
      }
      const remove = event.target.closest("[data-clock-remove]");
      if (remove) {
        state.flow.splice(Number(remove.dataset.clockRemove), 1);
        if (state.timer.phase === "idle") state.timer.remainingMs = openingMs(previewSpec());
        saveTimer();
        refreshClocks();
        return;
      }
      const up = event.target.closest("[data-clock-up]");
      if (up) {
        const index = Number(up.dataset.clockUp);
        if (index > 0) {
          const [item] = state.flow.splice(index, 1);
          state.flow.splice(index - 1, 0, item);
          if (state.timer.phase === "idle") state.timer.remainingMs = openingMs(previewSpec());
          saveTimer();
          refreshClocks();
        }
        return;
      }
      const down = event.target.closest("[data-clock-down]");
      if (!down) return;
      const index = Number(down.dataset.clockDown);
      if (index < state.flow.length - 1) {
        const [item] = state.flow.splice(index, 1);
        state.flow.splice(index + 1, 0, item);
        if (state.timer.phase === "idle") state.timer.remainingMs = openingMs(previewSpec());
        saveTimer();
        refreshClocks();
      }
    }

    clockSaveEl.addEventListener("click", onClockClick);
    timerClocks.addEventListener("click", onClockClick);
    timerClocks.addEventListener("input", (event) => {
      const edit = state.clockEdit;
      if (!edit) return;
      const el = event.target;
      const fields = {
        "clock-edit-name": "name",
        "clock-edit-work": "work",
        "clock-edit-rest": "rest",
        "clock-edit-rounds": "rounds",
        "clock-edit-min": "simpleMin",
        "clock-edit-sec": "simpleSec"
      };
      const key = fields[el.id];
      if (!key) return;
      edit[key] = el.value;
      if (el.id !== "clock-edit-name" || event.isComposing || !edit.error) return;
      const name = normalize(el.value).slice(0, 24);
      const stillTaken = name && state.clocks.some((item) => item.name === name && item.id !== edit.id);
      const stillEmpty = !name;
      if (edit.error === "同じ名前があります" && stillTaken) return;
      if (edit.error === "名前を入力してください" && stillEmpty) return;
      edit.error = "";
      const caret = el.selectionStart;
      refreshClocks();
      const next = document.getElementById("clock-edit-name");
      if (!next) return;
      next.focus();
      next.setSelectionRange(caret, caret);
    });
    timerClocks.addEventListener("change", (event) => {
      const edit = state.clockEdit;
      if (!edit) return;
      const el = event.target;
      if (el.id === "clock-edit-work") {
        el.value = String(readNumber(el, 1, 600, 20));
        edit.work = el.value;
      } else if (el.id === "clock-edit-rest") {
        el.value = String(readNumber(el, 0, 600, 10));
        edit.rest = el.value;
      } else if (el.id === "clock-edit-rounds") {
        el.value = String(readNumber(el, 1, 99, 8));
        edit.rounds = el.value;
      } else if (el.id === "clock-edit-min" || el.id === "clock-edit-sec") {
        const minInput = document.getElementById("clock-edit-min");
        const secInput = document.getElementById("clock-edit-sec");
        if (!minInput || !secInput) return;
        let minutes = readNumber(minInput, 0, 60, 0);
        let seconds = readNumber(secInput, 0, 59, 0);
        if (minutes >= 60) {
          minutes = 60;
          seconds = 0;
        }
        const total = Math.min(3600, Math.max(1, minutes * 60 + seconds));
        edit.simpleMin = String(Math.floor(total / 60));
        edit.simpleSec = String(total % 60);
        minInput.value = edit.simpleMin;
        secInput.value = edit.simpleSec;
      }
    });
    timerClocks.addEventListener("compositionend", (event) => {
      if (!event.target || event.target.id !== "clock-edit-name") return;
      ignoreClockEditEnter = true;
      setTimeout(() => { ignoreClockEditEnter = false; }, 0);
    });
    timerClocks.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.target.id !== "clock-edit-name") return;
      if (event.isComposing || event.keyCode === 229 || ignoreClockEditEnter) return;
      event.preventDefault();
      commitClockEdit();
    });
    clockSaveEl.addEventListener("input", (event) => {
      if (!event.target || event.target.id !== "clock-name") return;
      const ui = state.clockSave;
      const before = ui.phase;
      const hadError = ui.error;
      ui.draft = event.target.value;
      if (event.isComposing) return;
      if (ui.error) ui.error = "";
      if (ui.phase === "overwrite") {
        const name = normalize(event.target.value).slice(0, 24);
        if (!state.clocks.some((item) => item.name === name)) ui.phase = "save";
      }
      if (ui.phase === before && ui.error === hadError) return;
      const caret = event.target.selectionStart;
      renderClockSave();
      const next = document.getElementById("clock-name");
      if (!next) return;
      next.focus();
      next.setSelectionRange(caret, caret);
    });
    clockSaveEl.addEventListener("compositionend", (event) => {
      if (!event.target || event.target.id !== "clock-name") return;
      ignoreClockEnter = true;
      setTimeout(() => { ignoreClockEnter = false; }, 0);
    });
    clockSaveEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.target.id !== "clock-name") return;
      if (event.isComposing || event.keyCode === 229 || ignoreClockEnter) return;
      event.preventDefault();
      commitClock(state.clockSave.phase === "overwrite");
    });

    function returnToReady() {
      stopTimer();
      state.timer.phase = "idle";
      state.timer.round = 1;
      state.timer.run = null;
      state.timer.remainingMs = openingMs(previewSpec());
      renderTimer();
      renderClocks();
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") returnToReady();
    });
    window.addEventListener("pagehide", () => {
      saveTimer();
      returnToReady();
    });

    workInput.value = String(loadedTimer.work);
    restInput.value = String(loadedTimer.rest);
    roundInput.value = String(loadedTimer.rounds);
    writeSimpleFields(loadedTimer.simpleSec);
    state.timer.remainingMs = openingMs(previewSpec());

    renderMenu();
    renderSession();
    renderDb();
    renderTimer();
    showMode("menu");
    if (exercisesRepaired && exercisesReadable) saveExercises();
    if (loadedMenu.repaired && exercisesReadable) saveMenu();
    if (loadedTimer.repaired && exercisesReadable) saveTimer();
    if (loadedLibrary.repaired && exercisesReadable) saveLibrary();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
