<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="トレーニング">
  <meta name="theme-color" content="#f3f0e8">
  <title>トレーニング</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1b19;
      --muted: #6f6a62;
      --paper: #f3f0e8;
      --card: #fffcf7;
      --line: #e3ddd2;
      --track: #e6e0d4;
      --green: #1f6b4a;
      --green-soft: #e5f2eb;
      --blue: #1d4e89;
      --blue-soft: #e6eef8;
      --danger: #9d3b32;
      --shadow: 0 1px 2px rgba(28, 27, 25, 0.05);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .wrap {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-top: env(safe-area-inset-top);
      background: rgba(243, 240, 232, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(227, 221, 210, 0.9);
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px 24px;
      padding: 16px 0;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .gap-link {
      color: var(--green);
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }

    .tabs {
      display: flex;
      width: min(100%, 420px);
      padding: 4px;
      background: var(--track);
      border-radius: 14px;
    }

    .tabs button {
      flex: 1;
      min-height: 42px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #5c574f;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .tabs button[aria-selected="true"] {
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    main { padding: 8px 0 calc(72px + env(safe-area-inset-bottom)); }

    .lead {
      margin: 18px 0 20px;
      color: var(--muted);
    }

    .narrow { width: min(720px, 100%); }

    .progress {
      margin-bottom: 16px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .bar {
      height: 6px;
      border-radius: 99px;
      background: var(--track);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--green);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 16px 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .ord {
      margin: 0;
      font-family: Outfit, "Hiragino Sans", sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #9a948a;
    }

    .card h2 {
      margin: 2px 0 0;
      font-size: 1.35rem;
      line-height: 1.3;
      font-weight: 700;
    }

    .part {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .part i {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      display: block;
    }

    .note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .text-btn {
      border: 0;
      background: transparent;
      min-height: 40px;
      padding: 0 4px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .text-btn:hover { color: var(--ink); }
    .text-btn:disabled,
    .text-btn:disabled:hover { color: #c2bbb0; cursor: default; }

    .workout-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0 4px;
      align-items: center;
      min-height: 40px;
      margin: -8px 0 8px;
    }

    .workout-actions .confirm-note {
      flex: 1 1 100%;
      margin: 0 0 2px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .library { margin: 0 0 16px; }

    .library-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0 8px;
      min-height: 40px;
    }

    .library-label {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }

    .library-top .confirm-note {
      flex: 1 1 180px;
      margin: 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .library .chips { margin-top: 2px; }

    .library .chip {
      max-width: 100%;
      height: auto;
      padding-top: 8px;
      padding-bottom: 8px;
      white-space: normal;
      text-align: left;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .library-status {
      margin: 0 0 16px;
      font-weight: 700;
      color: var(--green);
    }

    .library-status:empty { display: none; }

    #menu-library:not([hidden]) + .library-status:not(:empty) { margin-top: -8px; }

    .library-save {
      flex: 1 0 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .library-save input[type="text"] {
      flex: 1 1 160px;
      width: auto;
      min-width: 0;
      margin-top: 0;
    }

    .library-save .form-error {
      flex: 1 0 100%;
      margin: 0;
    }

    .timer-library { grid-column: 1 / -1; }
    .timer-library .library { margin: 0; }
    .timer-library .library-status { margin: 8px 0 0; }

    .sets { margin-top: 12px; display: grid; gap: 6px; }

    .set {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: #f6f3ec;
      text-align: left;
      font-weight: 700;
    }

    .box {
      width: 22px;
      height: 22px;
      border: 2px solid #c9c2b4;
      border-radius: 6px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .set[aria-pressed="true"] {
      background: var(--green-soft);
      color: var(--green);
    }

    .set[aria-pressed="true"] .box,
    .session-row[aria-pressed="true"] .box {
      background: var(--green);
      border-color: var(--green);
    }

    .set[aria-pressed="true"] .box::after,
    .session-row[aria-pressed="true"] .box::after {
      content: "";
      width: 6px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: translateY(-1px) rotate(45deg);
    }

    .empty-slot {
      width: 100%;
      min-height: 112px;
      border: 1.5px dashed #cfc6b6;
      border-radius: 18px;
      background: transparent;
      margin-bottom: 12px;
      text-align: left;
      padding: 16px;
    }

    .empty-slot strong {
      display: block;
      font-size: 1.15rem;
    }

    .empty-slot span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .panel-card, form, .timer-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    form { padding: 18px; }

    form h2, .side-title {
      margin: 0 0 14px;
      font-size: 1.05rem;
    }

    label {
      display: block;
      margin-bottom: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    input[type="text"] {
      display: block;
      width: 100%;
      margin-top: 6px;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
    }

    fieldset {
      border: 0;
      margin: 0 0 14px;
      padding: 0;
    }

    legend {
      padding: 0;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid #ddd6c8;
      background: #fff;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .chip.is-on {
      background: var(--ink);
      border-color: var(--ink);
      color: #f4f1ea;
    }

    .chip.add {
      border: 1.5px dashed #cfc6b6;
      background: transparent;
      color: var(--ink);
    }

    .part-add {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .part-add input {
      flex: 1 1 160px;
      min-width: 0;
      margin-top: 0;
    }

    .part-delete {
      display: flex;
      flex-wrap: wrap;
      gap: 0 4px;
      align-items: center;
      margin-top: 4px;
    }

    .form-error {
      margin: 0 0 12px;
      color: var(--danger);
      font-weight: 700;
      font-size: 0.92rem;
    }

    .part-error {
      flex: 1 0 100%;
      margin: 8px 0 0;
    }

    .part-note {
      flex: 1 0 100%;
      margin: 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .form-actions { display: flex; gap: 8px; align-items: center; }

    .primary {
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: #f4f1ea;
      font-weight: 700;
    }

    .status {
      min-height: 1.4em;
      margin: 12px 0;
      font-weight: 700;
      color: var(--green);
    }

    .filters { margin: 4px 0 8px; }

    .group-label {
      margin: 18px 0 0;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .ex-row {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .ex-row h3 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .ex-row p { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 99px;
    }

    .row-actions { display: flex; gap: 4px; }

    .danger { color: var(--danger); }
    .text-btn.danger:hover { color: var(--danger); }

    .empty-copy {
      margin: 20px 0;
      color: var(--muted);
    }

    .timer-layout {
      display: grid;
      gap: 20px;
    }

    .timer-card {
      padding: 28px 22px 22px;
      text-align: center;
    }

    .phase {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .time {
      margin: 8px 0 0;
      font-family: Outfit, "Hiragino Sans", sans-serif;
      font-size: clamp(96px, 16vw, 132px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .round-label {
      margin: 10px 0 0;
      font-weight: 700;
    }

    .rounds {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 14px 0 8px;
    }

    .rounds[hidden] { display: none; }

    .rounds i {
      width: 10px;
      height: 10px;
      border-radius: 99px;
      background: #ddd6c8;
      display: block;
    }

    .rounds i.on { background: var(--ink); }
    .rounds i.now { outline: 2px solid var(--ink); outline-offset: 2px; }

    .spec {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .go {
      width: 100%;
      min-height: 56px;
      border-radius: 14px;
    }

    .timer-card.is-running .go {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--ink);
    }

    .timer-card.is-work { background: var(--green-soft); border-color: #cfe3d8; }
    .timer-card.is-work .phase, .timer-card.is-work .time { color: var(--green); }
    .timer-card.is-rest { background: var(--blue-soft); border-color: #d3e0f0; }
    .timer-card.is-rest .phase, .timer-card.is-rest .time { color: var(--blue); }
    .timer-card.is-done .time { font-size: clamp(64px, 10vw, 84px); letter-spacing: 0; }

    .ghost {
      margin-top: 8px;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .compact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 14px;
    }

    .compact h2 { font-size: 1.08rem; }

    .checks { display: flex; gap: 8px; }

    .dotcheck {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 0;
      background: #f6f3ec;
      font-family: Outfit, "Hiragino Sans", sans-serif;
      font-weight: 600;
    }

    .dotcheck[aria-pressed="true"] {
      background: var(--green);
      color: white;
    }

    dialog {
      border: 0;
      padding: 0;
      width: min(520px, calc(100vw - 32px));
      max-height: min(740px, calc(100vh - 40px));
      border-radius: 20px;
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(28, 27, 25, 0.24);
    }

    dialog::backdrop { background: rgba(28, 27, 25, 0.46); }

    .dialog-body {
      padding: 18px 18px 8px;
      overflow: auto;
      max-height: min(740px, calc(100vh - 40px));
    }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .pick {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 14px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .pick:disabled { color: #a39e94; cursor: default; }
    .pick small { color: var(--muted); font-weight: 700; }

    .shape {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .shape button {
      min-height: 68px;
      padding: 8px 6px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .shape strong, .shape span { display: block; }
    .shape strong { font-size: 0.92rem; line-height: 1.3; }
    .shape span { margin-top: 2px; color: var(--muted); font-size: 0.72rem; font-weight: 500; }

    .shape button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #f4f1ea;
    }

    .shape button[aria-pressed="true"] span { color: #d9d3c6; }

    .set-heading {
      margin: 20px 0 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .set-heading .set-note { font-weight: 500; }
    .set-heading .set-note::before { content: " · "; }

    .repeat-switch {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin: -4px 0 16px;
    }

    .repeat-switch[hidden] { display: none; }

    .repeat-switch p {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .repeat-switch div {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: min(100%, 280px);
    }

    .repeat-switch button {
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .repeat-switch button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #f4f1ea;
    }

    .timer-settings {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      margin: 4px 0 16px;
      text-align: left;
    }

    .timer-settings[hidden],
    #timer-editor[hidden] { display: none; }

    .timer-settings label { margin: 0; }

    .timer-settings.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .kind-switch {
      display: flex;
      padding: 4px;
      background: var(--track);
      border-radius: 14px;
      margin: 8px 0 12px;
    }

    .kind-switch button {
      flex: 1;
      min-height: 42px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #5c574f;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .kind-switch button[aria-pressed="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    .editor-label,
    .flow-caption {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .editor-label { margin: 8px 0 0; text-align: left; }

    .time.is-compact { font-size: clamp(64px, 12vw, 88px); }

    .save-row { display: flex; justify-content: flex-start; margin: 0 0 8px; }

    .clock-save {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 12px;
      text-align: left;
    }

    .clock-save input[type="text"] {
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
      margin-top: 0;
    }

    .clock-save .primary { min-height: 48px; }

    .clock-save .form-error { flex: 1 0 100%; margin: 0; }

    .clock-block { margin-top: 18px; }

    .clock-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 40px;
    }

    .clock-top h2 {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }

    .clock-hint {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .clock-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 64px;
      margin-bottom: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: left;
    }

    button.clock-row {
      width: 100%;
      font: inherit;
    }

    button.clock-row[aria-pressed="true"] {
      background: var(--green-soft);
      border-color: #cfe3d8;
    }

    .clock-row.is-current {
      background: var(--green-soft);
      border-color: #cfe3d8;
    }

    .clock-ord {
      flex: 0 0 auto;
      width: 28px;
      font-family: Outfit, "Hiragino Sans", sans-serif;
      font-weight: 600;
      color: #9a948a;
    }

    .clock-row .body { flex: 1; min-width: 0; }
    .clock-row strong { display: block; font-size: 1.02rem; line-height: 1.3; }

    .clock-row .meta {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .clock-row.is-current .meta { color: var(--green); }

    .clock-actions { display: flex; gap: 2px; flex: 0 0 auto; }

    .clock-row.is-editing {
      display: block;
      padding: 14px 14px 12px;
      border-color: var(--ink);
    }

    .clock-edit input[type="text"] { margin-top: 0; }

    .clock-edit .kind-switch { margin: 10px 0 12px; }

    .clock-edit .timer-settings { margin-bottom: 12px; }

    .clock-edit .edit-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .clock-edit .form-error { margin: 8px 0 0; }

    .clock-status {
      margin: 8px 0 0;
      font-weight: 700;
      color: var(--green);
    }

    .clock-status:empty { display: none; }

    input[type="number"] {
      display: block;
      width: 100%;
      margin-top: 6px;
      min-height: 48px;
      padding: 8px 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .add-end {
      width: 100%;
      min-height: 56px;
      margin-top: 4px;
      border: 1.5px dashed #cfc6b6;
      border-radius: 18px;
      background: transparent;
      font-weight: 700;
    }

    .session-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px;
      align-items: center;
      margin-bottom: 8px;
    }

    .session-row {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      text-align: left;
      box-shadow: var(--shadow);
    }

    .session-row strong { display: block; font-size: 1.05rem; line-height: 1.3; }
    .session-row .part { margin-top: 2px; }

    .session-row[aria-pressed="true"] {
      background: var(--green-soft);
      border-color: #cfe3d8;
      color: var(--green);
    }

    .session-row[aria-pressed="true"] .part { color: var(--green); }

    @media (min-width: 768px) {
      .shape { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      .timer-layout {
        grid-template-columns: minmax(0, 1fr) 320px;
        align-items: start;
      }
      .timer-card {
        position: sticky;
        top: calc(92px + env(safe-area-inset-top));
      }
    }

    @media (min-width: 1080px) {
      .wrap { width: min(1120px, calc(100% - 48px)); }
      .timer-layout { grid-template-columns: minmax(0, 1fr) 380px; }
    }

    @media (max-width: 767px) {
      .timer-library { order: -2; }
      .timer-card { order: -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap head">
      <div class="title-row">
        <h1>トレーニング</h1>
        <a class="gap-link" href="start.html">スタート位置</a>
      </div>
      <div class="tabs" role="tablist" aria-label="モード">
        <button type="button" role="tab" id="tab-menu" aria-controls="panel-menu" aria-selected="true">メニュー</button>
        <button type="button" role="tab" id="tab-db" aria-controls="panel-db" aria-selected="false">データベース</button>
        <button type="button" role="tab" id="tab-timer" aria-controls="panel-timer" aria-selected="false">タイマー</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="lead" id="lead">同じ5種目を、それぞれ3セット行います。</p>

    <section id="panel-menu" role="tabpanel" aria-labelledby="tab-menu">
      <div class="narrow">
        <div id="menu-library" class="library" hidden></div>
        <p class="library-status" id="menu-library-status" role="status"></p>
        <div class="shape" id="shape-switch" role="group" aria-label="メニューの形">
          <button type="button" data-shape="same" aria-pressed="true"><strong>同じ5種目</strong><span>それぞれ3セット</span></button>
          <button type="button" data-shape="ten" aria-pressed="false"><strong>10種目</strong><span>片方を2回</span></button>
          <button type="button" data-shape="fifteen" aria-pressed="false"><strong>15種目</strong><span>違う5種目×3</span></button>
          <button type="button" data-shape="free" aria-pressed="false"><strong>メニューフリー</strong><span>順番に進める</span></button>
        </div>
        <div class="repeat-switch" id="ten-repeat" hidden>
          <p id="ten-repeat-label">2回行う5種目</p>
          <div role="group" aria-labelledby="ten-repeat-label">
            <button type="button" data-repeat="0" aria-pressed="true">前の5種目</button>
            <button type="button" data-repeat="1" aria-pressed="false">後の5種目</button>
          </div>
        </div>
        <p class="form-error" id="menu-status" role="status" hidden></p>
        <div class="progress">
          <div class="progress-top">
            <span id="progress-label">セット</span>
            <span id="progress-count">0 / 15</span>
          </div>
          <div class="bar" aria-hidden="true"><span id="progress-fill"></span></div>
        </div>
        <div class="workout-actions" id="menu-actions"></div>
        <div id="menu-list"></div>
        <button class="add-end" type="button" id="add-free" hidden>末尾に追加</button>
      </div>
    </section>

    <section id="panel-db" role="tabpanel" aria-labelledby="tab-db" hidden>
      <div class="narrow">
        <form id="exercise-form">
          <h2 id="form-title">種目を追加</h2>
          <label>種目名
            <input type="text" id="name" name="name" maxlength="40" placeholder="スクワット" autocomplete="off">
          </label>
          <fieldset>
            <legend>部位</legend>
            <div class="chips" id="form-parts"></div>
            <div id="part-extra"></div>
          </fieldset>
          <label>メモ
            <input type="text" id="note" name="note" maxlength="80" placeholder="肩甲骨を寄せる、など" autocomplete="off">
          </label>
          <p class="form-error" id="form-error" hidden></p>
          <div class="form-actions">
            <button class="primary" type="submit" id="save-btn">登録する</button>
            <button class="text-btn" type="button" id="cancel-edit" hidden>キャンセル</button>
          </div>
        </form>
        <p class="status" id="db-status" role="status"></p>
        <div class="chips filters" id="db-filters"></div>
        <div id="db-list"></div>
      </div>
    </section>

    <section id="panel-timer" role="tabpanel" aria-labelledby="tab-timer" hidden>
      <p class="form-error" id="timer-status" role="status" hidden></p>
      <div class="timer-layout">
        <div id="timer-library-slot" class="timer-library" hidden>
          <div id="timer-library" class="library" hidden></div>
          <p class="library-status" id="timer-library-status" role="status"></p>
        </div>
        <div>
          <div id="timer-clocks"></div>
          <p class="clock-status" id="clock-status" role="status"></p>
          <div class="progress">
            <div class="progress-top">
              <span>セッション</span>

          </div>
          <div class="workout-actions" id="timer-actions"></div>
          <div id="timer-menu"></div>
          <button class="add-end" type="button" id="add-session">末尾に追加</button>
        </div>
        <aside class="timer-card" id="timer-card">
          <p class="phase" id="phase">準備</p>
          <p class="time" id="time" aria-live="polite">20</p>

          <div class="rounds" id="rounds" aria-hidden="true"></div>
          <div id="timer-editor">
            <p class="editor-label" id="editor-label" hidden>新しいタイマー</p>
            <div class="kind-switch" id="kind-switch" role="group" aria-label="タイマーの種類">
              <button type="button" data-kind="tabata" aria-pressed="true">タバタ</button>

              <label>ワーク
                <input id="work-sec" type="number" min="1" max="600" inputmode="numeric" value="20">

              <label>レスト
                <input id="rest-sec" type="number" min="0" max="600" inputmode="numeric" value="10">
              </label>
              <label>セット
                <input id="round-count" type="number" min="1" max="99" inputmode="numeric" value="8">
              </label>
            </div>
            <div class="timer-settings two" id="simple-settings" hidden>
              <label>分
                <input id="simple-min" type="number" min="0" max="60" inputmode="numeric" value="1">
              </label>
              <label>秒
                <input id="simple-sec" type="number" min="0" max="59" inputmode="numeric" value="0">
              </label>
            </div>
            <div id="clock-save"></div>
          </div>
          <button class="primary go" type="button" id="go">スタート</button>
          <button class="ghost" type="button" id="reset">最初から</button>

  </main>

  <dialog id="picker">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="picker-title">種目を選ぶ</h2>
        <button class="text-btn" type="button" id="close-picker">閉じる</button>
      </div>
      <div class="chips filters" id="picker-filters"></div>
      <div id="picker-list"></div>
    </div>
  </dialog>

  <script>
    const DEFAULT_PARTS = ["胸", "背中", "肩", "腕", "脚", "体幹", "全身"];
    const EXTRA_COLORS = ["#2f7a72", "#8a4e62", "#4f5d8a", "#5f6638", "#7a5530", "#3e6a78"];
    const PART_COLOR = {
      胸: "#c4673a",
      背中: "#2f6f8f",
      肩: "#a6842d",
      腕: "#7a4e86",
      脚: "#2f7d4a",
      体幹: "#a33b3b",
      全身: "#3e3a34"
    };
    const SHAPES = {
      same: { count: 5, setsEach: 3, groups: 1, lead: "同じ5種目を、それぞれ3セット行います。" },
      ten: { count: 10, setsEach: 1, groups: 2, performed: 15, lead: "5種目を2つ作り、どちらかを2回行って、15種目にします。" },
      fifteen: { count: 15, setsEach: 1, groups: 3, lead: "違う5種目を、3セット行います。" }
    };
    const FREE_LEAD = "時間を区切らず、種目を順番に行います。";
    const LEADS = {
      db: "種目を登録し、部位ごとに探します。",
      timer: "タバタか一定時間を保存し、選んだ順に計測できます。種目は末尾に足せます。"
    };
    const EXERCISE_KEY = "gym-training-exercises";
    const PARTS_KEY = "gym-training-parts";
    const MENU_KEY = "gym-training-menu";
    const TIMER_KEY = "gym-training-timer";
    const LIBRARY_KEY = "gym-training-library";
    const LIBRARY_LIMIT = 30;
    let exercisesReadable = true;
    let exercisesRepaired = false;
    let exerciseSeq = 0;
    let sessionSeq = 0;
    let librarySeq = 0;

    function newExerciseId() {
      exerciseSeq += 1;
      return `ex-${Date.now().toString(36)}-${exerciseSeq.toString(36)}`;
    }

    function normalize(value) {
      return String(value).replace(/^[\s\u3000]+|[\s\u3000]+$/g, "");
    }

    function loadCustomParts() {
      try {
        const raw = localStorage.getItem(PARTS_KEY);
        if (raw == null) return { ok: false };
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return { ok: false };
        const parts = [];
        const seen = new Set();
        for (const item of parsed) {
          if (!item || typeof item !== "object" || Array.isArray(item)) return { ok: false };
          if (typeof item.name !== "string" || typeof item.color !== "string") return { ok: false };
          const name = item.name;
          if (!name || name !== normalize(name) || name.length > 16) return { ok: false };
          if (name === "すべて" || DEFAULT_PARTS.includes(name) || seen.has(name)) return { ok: false };
          if (!EXTRA_COLORS.includes(item.color)) return { ok: false };
          seen.add(name);
          parts.push({ name, color: item.color });
        }
        return { ok: true, parts };
      } catch (error) {
        return { ok: false };
      }
    }

    function loadExercises(knownParts) {
      try {
        const raw = localStorage.getItem(EXERCISE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        const seen = new Set();
        return parsed.flatMap((item) => {
          if (!item || typeof item.id !== "string" || !item.id) return [];
          if (typeof item.name !== "string" || !item.name.trim()) return [];
          if (typeof item.part !== "string" || !normalize(item.part)) return [];
          if (knownParts && !knownParts.has(item.part)) return [];
          if (item.note !== undefined && typeof item.note !== "string") return [];
          let id = item.id;
          if (seen.has(id)) {
            id = newExerciseId();
            exercisesRepaired = true;
          }
          seen.add(id);
          return [{
            id,
            name: item.name.trim().slice(0, 40),
            part: item.part,
            note: String(item.note || "").trim().slice(0, 80)
          }];
        });
      } catch (error) {
        exercisesReadable = false;
        return [];
      }
    }

    function recoverParts(exercises) {
      const seen = new Set(DEFAULT_PARTS);
      const names = [];
      for (const exercise of exercises) {
        if (seen.has(exercise.part)) continue;
        seen.add(exercise.part);
        names.push(exercise.part);
      }
      return names.map((name, index) => ({
        name,
        color: EXTRA_COLORS[index % EXTRA_COLORS.length]
      }));
    }

    function saveExercises() {
      try {
        localStorage.setItem(EXERCISE_KEY, JSON.stringify(state.exercises));
        return true;
      } catch (error) {
        dbStatus.textContent = "保存できませんでした";
        return false;
      }
    }

    function saveParts() {
      try {
        localStorage.setItem(PARTS_KEY, JSON.stringify(state.customParts));
        return true;
      } catch (error) {
        dbStatus.textContent = "保存できませんでした";
        return false;
      }
    }

    function emptyMenu(count) {
      return Array.from({ length: count }, () => null);
    }

    function newSessionKey() {
      sessionSeq += 1;
      return `s-${Date.now().toString(36)}-${sessionSeq.toString(36)}`;
    }

    function newLibraryId() {
      librarySeq += 1;
      return `lib-${Date.now().toString(36)}-${librarySeq.toString(36)}`;
    }

    function normalizeSession(source, known) {
      const seen = new Set();
      const counts = new Map();
      const session = [];
      if (!Array.isArray(source)) return session;
      for (const item of source) {
        if (!item || typeof item !== "object" || Array.isArray(item)) continue;
        if (typeof item.exerciseId !== "string" || !item.exerciseId) continue;
        if (known && !known.has(item.exerciseId)) continue;
        const count = counts.get(item.exerciseId) || 0;
        if (count >= 2) continue;
        counts.set(item.exerciseId, count + 1);
        let key = typeof item.key === "string" && item.key ? item.key : newSessionKey();
        if (seen.has(key)) key = newSessionKey();
        seen.add(key);
        session.push({ key, exerciseId: item.exerciseId, done: item.done === true });
      }
      return session;
    }

    function checkSlot(key) {
      const same = /^same-(\d+)-(\d+)$/.exec(key);
      if (same) {
        const index = Number(same[1]);
        const set = Number(same[2]);
        if (index < SHAPES.same.count && set < SHAPES.same.setsEach) return { shape: "same", index };
        return null;
      }
      const ten = /^ten-(\d+)(?:-(\d+))?$/.exec(key);
      if (ten) {
        const index = Number(ten[1]);
        const pass = ten[2] === undefined ? 0 : Number(ten[2]);
        if (index < SHAPES.ten.count && (pass === 0 || pass === 1)) return { shape: "ten", index, pass };
        return null;
      }
      const fifteen = /^fifteen-(\d+)$/.exec(key);
      if (!fifteen) return null;
      const index = Number(fifteen[1]);
      if (index < SHAPES.fifteen.count) return { shape: "fifteen", index };
      return null;
    }

    function loadMenu(exercises) {
      const blank = {
        menuShape: "same",
        menus: {
          same: emptyMenu(SHAPES.same.count),
          ten: emptyMenu(SHAPES.ten.count),
          fifteen: emptyMenu(SHAPES.fifteen.count)
        },
        free: [],
        checks: {},
        tenRepeat: 0,
        repaired: false
      };
      let stored;
      try {
        const raw = localStorage.getItem(MENU_KEY);
        if (!raw) return blank;
        stored = JSON.parse(raw);
      } catch (error) {
        return blank;
      }
      if (!stored || typeof stored !== "object" || Array.isArray(stored)) {
        return { ...blank, repaired: true };
      }

      const menuShape = stored.menuShape === "free" || (stored.menuShape && SHAPES[stored.menuShape])
        ? stored.menuShape
        : "same";
      const tenRepeat = stored.tenRepeat === 1 ? 1 : 0;
      const known = new Set(exercises.map((item) => item.id));
      const menus = {};
      for (const [shape, spec] of Object.entries(SHAPES)) {
        const source = stored.menus && Array.isArray(stored.menus[shape]) ? stored.menus[shape] : [];
        const counts = new Map();
        menus[shape] = Array.from({ length: spec.count }, (_, index) => {
          const id = source[index];
          if (typeof id !== "string" || !id) return null;
          if (exercisesReadable && !known.has(id)) return null;
          const count = counts.get(id) || 0;
          if (count >= 2) return null;
          counts.set(id, count + 1);
          return id;
        });
      }

      const free = normalizeSession(stored.free, exercisesReadable ? known : null);
      const checks = {};
      const sourceChecks = stored.checks && typeof stored.checks === "object" && !Array.isArray(stored.checks)
        ? stored.checks
        : {};
      for (const [key, on] of Object.entries(sourceChecks)) {
        if (on !== true) continue;
        const slot = checkSlot(key);
        if (!slot || !menus[slot.shape][slot.index]) continue;
        if (slot.shape === "ten") {
          const group = slot.index < 5 ? 0 : 1;
          if (slot.pass === 1 && group !== tenRepeat) continue;
          checks[checkKey("ten", slot.index, slot.pass)] = true;
          continue;
        }
        checks[key] = true;
      }

      const normalized = JSON.stringify({ menuShape, menus, free, checks, tenRepeat });
      const original = JSON.stringify({
        menuShape: stored.menuShape,
        menus: stored.menus,
        free: stored.free,
        checks: stored.checks,
        tenRepeat: stored.tenRepeat
      });
      return { menuShape, menus, free, checks, tenRepeat, repaired: normalized !== original };
    }

    function loadTimer(exercises) {
      const blank = {
        work: 20,
        rest: 10,
        rounds: 8,
        kind: "tabata",
        simpleSec: 60,
        session: [],
        clocks: [],
        flow: [],
        repaired: false
      };
      let stored;
      try {
        const raw = localStorage.getItem(TIMER_KEY);
        if (!raw) return blank;
        stored = JSON.parse(raw);
      } catch (error) {
        return { ...blank, repaired: true };
      }
      if (!stored || typeof stored !== "object" || Array.isArray(stored)) {
        return { ...blank, repaired: true };
      }

      const work = readStoredNumber(stored.work, 1, 600, 20);
      const rest = readStoredNumber(stored.rest, 0, 600, 10);
      const rounds = readStoredNumber(stored.rounds, 1, 99, 8);
      const kind = stored.kind === "simple" ? "simple" : "tabata";
      const simpleSec = readStoredNumber(stored.simpleSec, 1, 3600, 60);
      const known = new Set(exercises.map((item) => item.id));
      const session = normalizeSession(stored.session, exercisesReadable ? known : null);
      const clocks = [];
      const clockNames = new Set();
      const clockIds = new Set();
      const clockSource = Array.isArray(stored.clocks) ? stored.clocks : [];
      let clocksChanged = !Array.isArray(stored.clocks);
      for (const item of clockSource) {
        if (clocks.length >= 30) {
          clocksChanged = true;
          break;
        }
        const cleaned = cleanStoredClock(item, clockNames, clockIds);
        if (!cleaned) {
          clocksChanged = true;
          continue;
        }
        if (cleaned.changed) clocksChanged = true;
        clocks.push(cleaned.clock);
      }
      const knownClocks = new Set(clocks.map((item) => item.id));
      const flow = [];
      const flowSource = Array.isArray(stored.flow) ? stored.flow : [];
      let flowChanged = !Array.isArray(stored.flow);
      for (const id of flowSource) {
        if (flow.length >= 12) {
          flowChanged = true;
          break;
        }
        if (typeof id !== "string" || !knownClocks.has(id)) {
          flowChanged = true;
          continue;
        }
        flow.push(id);
      }

      const normalized = JSON.stringify({ work, rest, rounds, kind, simpleSec, session, clocks, flow });
      const original = JSON.stringify({
        work: stored.work,
        rest: stored.rest,
        rounds: stored.rounds,
        kind: stored.kind,
        simpleSec: stored.simpleSec,
        session: stored.session,
        clocks: stored.clocks,
        flow: stored.flow
      });
      return {
        work,
        rest,
        rounds,
        kind,
        simpleSec,
        session,
        clocks,
        flow,
        repaired: normalized !== original || clocksChanged || flowChanged
      };
    }

    function cleanStoredClock(item, names, ids) {
      if (!item || typeof item !== "object" || Array.isArray(item)) return null;
      const named = cleanPresetName(item.name, names);
      if (!named.name) return null;
      const identified = cleanPresetId(item.id, ids);
      if (item.kind === "simple") {
        const seconds = readStoredNumber(item.seconds, 1, 3600, 60);
        return {
          clock: { id: identified.id, name: named.name, kind: "simple", seconds },
          changed: named.changed || identified.changed || seconds !== item.seconds
        };
      }
      if (item.kind !== "tabata") return null;
      const work = readStoredNumber(item.work, 1, 600, 20);
      const rest = readStoredNumber(item.rest, 0, 600, 10);
      const rounds = readStoredNumber(item.rounds, 1, 99, 8);
      return {
        clock: { id: identified.id, name: named.name, kind: "tabata", work, rest, rounds },
        changed: named.changed || identified.changed || work !== item.work || rest !== item.rest || rounds !== item.rounds
      };
    }

    function cleanPresetId(value, seen) {
      if (typeof value === "string" && value && !seen.has(value)) {
        seen.add(value);
        return { id: value, changed: false };
      }
      const id = newLibraryId();
      seen.add(id);
      return { id, changed: true };
    }

    function cleanPresetName(value, seen) {
      if (typeof value !== "string") return { name: "", changed: true };
      const name = normalize(value).slice(0, 24);
      if (!name || seen.has(name)) return { name: "", changed: true };
      seen.add(name);
      return { name, changed: name !== value };
    }

    function cleanIdList(source, known, limit) {
      let changed = !Array.isArray(source);
      const counts = new Map();
      const items = [];
      const list = Array.isArray(source) ? source : [];
      if (Array.isArray(source) && source.length > limit) changed = true;
      for (const id of list) {
        if (items.length >= limit) break;
        if (typeof id !== "string" || !id || (known && !known.has(id))) {
          changed = true;
          continue;
        }
        const count = counts.get(id) || 0;
        if (count >= 2) {
          changed = true;
          continue;
        }
        counts.set(id, count + 1);
        items.push(id);
      }
      return { items, changed };
    }

    function cleanSlots(source, count, known) {
      let changed = !Array.isArray(source) || source.length !== count;
      const counts = new Map();
      const slots = Array.from({ length: count }, (_, index) => {
        const id = Array.isArray(source) ? source[index] : undefined;
        if (id == null) return null;
        if (id === "") {
          changed = true;
          return null;
        }
        if (typeof id !== "string" || (known && !known.has(id))) {
          changed = true;
          return null;
        }
        const used = counts.get(id) || 0;
        if (used >= 2) {
          changed = true;
          return null;
        }
        counts.set(id, used + 1);
        return id;
      });
      return { slots, changed };
    }

    function loadLibrary(exercises) {
      const blank = { menu: [], timer: [], repaired: false };
      let stored;
      try {
        const raw = localStorage.getItem(LIBRARY_KEY);
        if (raw == null) return blank;
        stored = JSON.parse(raw);
      } catch (error) {
        return { ...blank, repaired: true };
      }
      if (!stored || typeof stored !== "object" || Array.isArray(stored)) {
        return { ...blank, repaired: true };
      }

      const known = exercisesReadable ? new Set(exercises.map((item) => item.id)) : null;
      const ids = new Set();
      let repaired = !Array.isArray(stored.menu) || !Array.isArray(stored.timer);
      const menuNames = new Set();
      const timerNames = new Set();
      const menu = [];
      const timer = [];
      const menuSource = Array.isArray(stored.menu) ? stored.menu : [];
      const timerSource = Array.isArray(stored.timer) ? stored.timer : [];

      for (const item of menuSource) {
        if (menu.length >= LIBRARY_LIMIT) {
          repaired = true;
          break;
        }
        if (!item || typeof item !== "object" || Array.isArray(item)) {
          repaired = true;
          continue;
        }
        const shape = item.shape === "free" || SHAPES[item.shape] ? item.shape : "";
        if (!shape) {
          repaired = true;
          continue;
        }
        const named = cleanPresetName(item.name, menuNames);
        if (!named.name) {
          repaired = true;
          continue;
        }
        const identified = cleanPresetId(item.id, ids);
        if (shape === "free") {
          const cleaned = cleanIdList(item.items, known, 200);
          if (!cleaned.items.length) {
            repaired = true;
            continue;
          }
          if (named.changed || identified.changed || cleaned.changed || item.slots || item.tenRepeat) repaired = true;
          menu.push({ id: identified.id, name: named.name, shape: "free", items: cleaned.items });
          continue;
        }
        const cleaned = cleanSlots(item.slots, SHAPES[shape].count, known);
        if (!cleaned.slots.some(Boolean)) {
          repaired = true;
          continue;
        }
        const tenRepeat = item.tenRepeat === 1 ? 1 : 0;
        if (named.changed || identified.changed || cleaned.changed) repaired = true;
        if (shape === "ten" && item.tenRepeat !== 0 && item.tenRepeat !== 1) repaired = true;
        if (shape !== "ten" && item.tenRepeat) repaired = true;
        if (item.items) repaired = true;
        const preset = { id: identified.id, name: named.name, shape, slots: cleaned.slots };
        if (shape === "ten") preset.tenRepeat = tenRepeat;
        menu.push(preset);
      }

      for (const item of timerSource) {
        if (timer.length >= LIBRARY_LIMIT) {
          repaired = true;
          break;
        }
        if (!item || typeof item !== "object" || Array.isArray(item)) {
          repaired = true;
          continue;
        }
        const named = cleanPresetName(item.name, timerNames);
        if (!named.name) {
          repaired = true;
          continue;
        }
        const identified = cleanPresetId(item.id, ids);
        const cleaned = cleanIdList(item.exercises, known, 200);
        if (!cleaned.items.length) {
          repaired = true;
          continue;
        }
        const work = readStoredNumber(item.work, 1, 600, 20);
        const rest = readStoredNumber(item.rest, 0, 600, 10);
        const rounds = readStoredNumber(item.rounds, 1, 99, 8);
        if (named.changed || identified.changed || cleaned.changed) repaired = true;
        if (work !== item.work || rest !== item.rest || rounds !== item.rounds) repaired = true;
        timer.push({
          id: identified.id,
          name: named.name,
          exercises: cleaned.items,
          work,
          rest,
          rounds
        });
      }

      return { menu, timer, repaired };
    }

    function readStoredNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, Math.round(number)));
    }

          clocks: state.clocks,
          flow: state.flow,
          session: state.session.map((item) => ({
            key: item.key,
            exerciseId: item.exerciseId,
            done: item.done === true
          }))
        }));
        if (timerStatus) {
          timerStatus.textContent = "";
          timerStatus.hidden = true;
        }
      } catch (error) {
        if (timerStatus) {
          timerStatus.textContent = "保存できませんでした";
          timerStatus.hidden = false;
        }
      }
    }

          tenRepeat: state.tenRepeat === 1 ? 1 : 0

          menuStatus.textContent = "";
          menuStatus.hidden = true;
        }
      } catch (error) {
        if (menuStatus) {
          menuStatus.textContent = "保存できませんでした";
          menuStatus.hidden = false;
        }
      }
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    function exerciseById(id) {
      return state.exercises.find((item) => item.id === id) || null;
    }

    function currentMenu() {
      return state.menus[state.menuShape];
    }

    function shapeOf() {
      return SHAPES[state.menuShape];
    }

    function isFreeMenu() {
      return state.menuShape === "free";
    }

    function menuHasSelection() {
      return isFreeMenu() ? state.free.length > 0 : currentMenu().some((id) => id);
    }

    function sameList(left, right) {
      return left.length === right.length && left.every((value, index) => value === right[index]);
    }

    function snapshotMenu() {
      if (isFreeMenu()) return { shape: "free", items: state.free.map((item) => item.exerciseId) };
      const body = { shape: state.menuShape, slots: currentMenu().slice() };
      if (state.menuShape === "ten") body.tenRepeat = state.tenRepeat === 1 ? 1 : 0;
      return body;
    }

    function snapshotTimer() {
      return {
        exercises: state.session.map((item) => item.exerciseId),
        work: readNumber(workInput, 1, 600, 20),
        rest: readNumber(restInput, 0, 600, 10),
        rounds: readNumber(roundInput, 1, 99, 8)
      };
    }

    function menuPresetMatches(preset) {
      const current = snapshotMenu();
      if (preset.shape !== current.shape) return false;
      if (preset.shape === "free") return sameList(preset.items, current.items);
      if (preset.shape === "ten" && (preset.tenRepeat === 1 ? 1 : 0) !== (current.tenRepeat === 1 ? 1 : 0)) return false;
      return sameList(preset.slots, current.slots);
    }

    function timerPresetMatches(preset) {
      const current = snapshotTimer();
      return sameList(preset.exercises, current.exercises)
        && preset.work === current.work
        && preset.rest === current.rest
        && preset.rounds === current.rounds;
    }

    function menuLead() {
      return isFreeMenu() ? FREE_LEAD : shapeOf().lead;
    }

    function readNumber(input, min, max, fallback) {
      const value = Number(input.value);
      if (!Number.isFinite(value)) return fallback;
      return Math.min(max, Math.max(min, Math.round(value)));
    }

    function workMs() { return readNumber(workInput, 1, 600, 20) * 1000; }
    function restMs() { return readNumber(restInput, 0, 600, 10) * 1000; }
    function roundTotal() { return readNumber(roundInput, 1, 99, 8); }

    function checkKey(shape, index, set) {
      return set === undefined ? `${shape}-${index}` : `${shape}-${index}-${set}`;
    }

    function clearSlotChecks(shape, index) {
      if (shape === "ten") {
        delete state.checks[checkKey(shape, index, 0)];
        delete state.checks[checkKey(shape, index, 1)];
        delete state.checks[`${shape}-${index}`];
        return;
      }
      const sets = SHAPES[shape].setsEach;
      if (sets === 1) delete state.checks[checkKey(shape, index)];
      else for (let set = 0; set < sets; set += 1) delete state.checks[checkKey(shape, index, set)];
    }

    function chip(label, on, attrs, extraClass) {
      const classes = `chip${on ? " is-on" : ""}${extraClass ? ` ${extraClass}` : ""}`;
      return `<button type="button" class="${classes}" ${attrs}>${esc(label)}</button>`;
    }

    function allParts() {
      return DEFAULT_PARTS.concat(state.customParts.map((item) => item.name));
    }

    function isCustomPart(name) {
      return state.customParts.some((item) => item.name === name);
    }

    function colorOf(name) {
      if (DEFAULT_PARTS.includes(name)) return PART_COLOR[name];
      const custom = state.customParts.find((item) => item.name === name);
      return custom ? custom.color : "#3e3a34";
    }

    function nextColor() {
      const used = new Set(state.customParts.map((item) => item.color));
      if (used.size < EXTRA_COLORS.length) {
        let maxIndex = -1;
        for (const item of state.customParts) {
          const index = EXTRA_COLORS.indexOf(item.color);
          if (index > maxIndex) maxIndex = index;
        }
        if (maxIndex < EXTRA_COLORS.length - 1) return EXTRA_COLORS[maxIndex + 1];
        const open = EXTRA_COLORS.find((color) => !used.has(color));
        if (open) return open;
      }
      return EXTRA_COLORS[state.customParts.length % EXTRA_COLORS.length];
    }

    function renderChips(target, selected, attrName) {
      const all = attrName === "data-part"
        ? ""
        : chip("すべて", selected === null, 'data-all="true"');
      const parts = allParts().map((part) => chip(part, selected === part, `${attrName}="${esc(part)}"`)).join("");
      const add = attrName === "data-part" && !state.addingPart
        ? chip("部位を追加", false, 'data-add-part aria-expanded="false"', "add")
        : "";
      target.innerHTML = all + parts + add;
    }

    function capturePartDraft() {
      const input = document.getElementById("part-name");
      if (!input || !state.addingPart) return null;
      state.partDraft = input.value;
      return {
        start: input.selectionStart,
        end: input.selectionEnd,
        focused: document.activeElement === input
      };
    }

    function partWarning(name) {
      const items = state.exercises.filter((item) => item.part === name);
      if (items.length === 1) return `『${items[0].name}』も削除されます`;
      if (items.length > 1) return `この部位の${items.length}種目も削除されます`;
      return "";
    }

    function renderPartExtra() {
      const adding = state.addingPart
        ? `<div class="part-add">
            <input type="text" id="part-name" maxlength="16" placeholder="ハムストリング、など" autocomplete="off" aria-label="部位名" value="${esc(state.partDraft)}">
            <button class="primary" type="button" data-commit-part>追加する</button>
            <button class="text-btn" type="button" data-cancel-part>やめる</button>
            ${state.partError ? `<p class="form-error part-error">${esc(state.partError)}</p>` : ""}
          </div>`
        : "";
      let deleting = "";
      if (isCustomPart(state.formPart)) {
        if (state.partDeleteArmed) {
          const warning = partWarning(state.formPart);
          deleting = `<div class="part-delete">
            ${warning ? `<p class="part-note">${esc(warning)}</p>` : ""}
            <button type="button" class="text-btn danger" data-delete-part>削除する</button>
            <button type="button" class="text-btn" data-cancel-part-delete>やめる</button>
          </div>`;
        } else {
          deleting = `<div class="part-delete">
            <button type="button" class="text-btn" data-arm-part>この部位を削除</button>
          </div>`;
        }
      }
      partExtra.innerHTML = deleting + adding;
    }

    function renderFormParts(preserved) {
      renderChips(formParts, state.formPart, "data-part");
      renderPartExtra();
      const next = document.getElementById("part-name");
      if (state.focusPart) {
        state.focusPart = false;
        if (next) {
          next.focus();
          const end = next.value.length;
          next.setSelectionRange(end, end);
        }
        return;
      }
      if (state.focusName) {
        state.focusName = false;
        nameInput.focus();
        return;
      }
      if (preserved && preserved.focused && next) {
        next.focus();
        const end = next.value.length;
        const start = Math.min(preserved.start ?? end, end);
        const stop = Math.min(preserved.end ?? end, end);
        next.setSelectionRange(start, stop);
      }
    }

    function hasShapeChecks(shape) {
      const prefix = `${shape}-`;
      return Object.keys(state.checks).some((key) => state.checks[key] === true && key.startsWith(prefix));
    }

    function deleteShapeChecks(shape) {
      const prefix = `${shape}-`;
      for (const key of Object.keys(state.checks)) {
        if (key.startsWith(prefix)) delete state.checks[key];
      }
    }

    function selectionCounts(ids, exceptIndex) {
      const counts = new Map();
      ids.forEach((id, index) => {
        if (!id || index === exceptIndex) return;
        counts.set(id, (counts.get(id) || 0) + 1);
      });
      return counts;
    }

    function renderWorkoutActions(mode) {
      const target = document.getElementById(mode === "menu" ? "menu-actions" : "timer-actions");
      if (!target) return;
      const fieldId = `${mode}-library-name`;
      const previous = document.getElementById(fieldId);
      const preserve = previous && document.activeElement === previous
        ? { start: previous.selectionStart, end: previous.selectionEnd }
        : null;
      if (preserve) state.libraryUi[mode].draft = previous.value;

      const ui = state.libraryUi[mode];
      if (ui.phase === "save" || ui.phase === "overwrite") {
        const error = ui.error ? `<p class="form-error">${esc(ui.error)}</p>` : "";
        const actions = ui.phase === "overwrite"
          ? `<p class="part-note">同じ名前があります</p>
            <button type="button" class="primary" data-library-overwrite>上書きする</button>
            <button type="button" class="text-btn" data-library-cancel>やめる</button>`
          : `<button type="button" class="primary" data-library-commit>保存する</button>
            <button type="button" class="text-btn" data-library-cancel>やめる</button>`;
        target.innerHTML = `<div class="library-save">
          <input type="text" id="${fieldId}" maxlength="24" placeholder="胸の日、など" aria-label="メニュー名" autocomplete="off" value="${esc(ui.draft)}">
          ${actions}
          ${error}
        </div>`;
        const next = document.getElementById(fieldId);
        if (state.focusLibrary === mode && next) {
          state.focusLibrary = null;
          next.focus();
          const end = next.value.length;
          next.setSelectionRange(end, end);
        } else if (preserve && next) {
          next.focus();
          const end = next.value.length;
          next.setSelectionRange(Math.min(preserve.start ?? end, end), Math.min(preserve.end ?? end, end));
        }
        return;
      }

      const resetKey = `${mode}-reset`;
      const clearKey = `${mode}-clear`;
      if (state.actionArmed === resetKey) {
        const note = mode === "menu" && !isFreeMenu() ? "セットのチェックを外します" : "完了チェックを外します";
        target.innerHTML = `<p class="confirm-note">${note}</p>
          <button type="button" class="text-btn" data-arm-action="confirm-reset">リセットする</button>
          <button type="button" class="text-btn" data-arm-action="cancel">やめる</button>`;
        return;
      }
      if (state.actionArmed === clearKey) {
        target.innerHTML = `<p class="confirm-note">選んだ種目をすべて外します</p>
          <button type="button" class="text-btn danger" data-arm-action="confirm-clear">クリアする</button>
          <button type="button" class="text-btn" data-arm-action="cancel">やめる</button>`;
        return;
      }
      const canReset = mode === "menu"
        ? (isFreeMenu() ? state.free.some((item) => item.done) : hasShapeChecks(state.menuShape))
        : state.session.some((item) => item.done);
      const canClear = mode === "menu" ? menuHasSelection() : state.session.length > 0;
      target.innerHTML = `<button type="button" class="text-btn" data-arm-action="reset" ${canReset ? "" : "disabled"}>進行をリセット</button>
        <button type="button" class="text-btn" data-arm-action="clear" ${canClear ? "" : "disabled"}>メニューをクリア</button>
        <button type="button" class="text-btn" data-arm-action="save" ${canClear ? "" : "disabled"}>メニューを保存</button>`;
    }

    function resetMenuProgress() {
      if (isFreeMenu()) {
        for (const item of state.free) item.done = false;
      } else {
        deleteShapeChecks(state.menuShape);
      }
      state.actionArmed = null;
      saveMenu();
      renderMenu();
    }

    function clearCurrentMenu() {
      if (isFreeMenu()) {
        state.free = [];
      } else {
        const shape = state.menuShape;
        const list = state.menus[shape];
        for (let index = 0; index < list.length; index += 1) list[index] = null;
        deleteShapeChecks(shape);
        if (shape === "ten") state.tenRepeat = 0;
      }
      state.actionArmed = null;
      saveMenu();
      renderMenu();
    }

    function resetTimerProgress() {
      for (const item of state.session) item.done = false;
      state.actionArmed = null;
      saveTimer();
      renderSession();
    }

    function clearTimerMenu() {
      state.session = [];
      state.actionArmed = null;
      saveTimer();
      renderSession();
    }

    function closeLibraryEditors(mode) {
      const ui = state.libraryUi[mode];
      ui.phase = null;
      ui.draft = "";
      ui.error = "";
      ui.deleteId = null;
    }

    function libraryDraftName(mode) {
      const input = document.getElementById(`${mode}-library-name`);
      if (input) state.libraryUi[mode].draft = input.value;
      return normalize(state.libraryUi[mode].draft).slice(0, 24);
    }

    function refreshLibrary(mode) {
      renderLibrary(mode);
      renderWorkoutActions(mode);
    }

    function flashLibrary(mode, message) {
      state.libraryStatus[mode] = message;
      state.libraryHold = mode;
    }

    function presetIsCurrent(mode, preset) {
      return mode === "menu" ? menuPresetMatches(preset) : timerPresetMatches(preset);
    }

    function renderLibrary(mode) {
      const root = document.getElementById(mode === "menu" ? "menu-library" : "timer-library");
      const statusEl = document.getElementById(`${mode}-library-status`);
      const slot = mode === "timer" ? document.getElementById("timer-library-slot") : null;
      if (!root || !statusEl) return;
      const ui = state.libraryUi[mode];
      const presets = state.library[mode];
      if ((ui.phase === "delete" || ui.phase === "confirm-delete") && !presets.length) {
        ui.phase = null;
        ui.deleteId = null;
      } else if (ui.phase === "confirm-delete" && !presets.some((item) => item.id === ui.deleteId)) {
        ui.phase = "delete";
        ui.deleteId = null;
      }
      if (state.libraryHold === mode) state.libraryHold = null;
      else state.libraryStatus[mode] = "";
      statusEl.textContent = state.libraryStatus[mode];
      root.hidden = presets.length === 0;
      if (slot) slot.hidden = root.hidden && statusEl.textContent === "";
      if (!presets.length) {
        root.innerHTML = "";
        return;
      }
      const picking = ui.phase === "delete" || ui.phase === "confirm-delete";
      let head = "";
      if (ui.phase === "confirm-delete") {
        const preset = presets.find((item) => item.id === ui.deleteId);
        head = `<p class="confirm-note">『${esc(preset.name)}』を削除します</p>
          <button type="button" class="text-btn danger" data-library-confirm-delete>削除する</button>
          <button type="button" class="text-btn" data-library-cancel>やめる</button>`;
      } else if (ui.phase === "delete") {
        head = `<p class="library-label">削除するメニューを選んでください</p>
          <button type="button" class="text-btn" data-library-cancel>やめる</button>`;
      } else {
        head = `<p class="library-label">保存したメニュー</p>
          <button type="button" class="text-btn" data-library-arm-delete>削除</button>`;
      }
      const chips = presets.map((preset) => {
        const on = !picking && presetIsCurrent(mode, preset);
        return `<button type="button" class="chip${on ? " is-on" : ""}" data-library-open="${esc(preset.id)}" aria-pressed="${on}">${esc(preset.name)}</button>`;
      }).join("");
      root.innerHTML = `<div class="library-top">${head}</div><div class="chips">${chips}</div>`;
    }

    function loadMenuPreset(preset) {
      if (menuPresetMatches(preset)) return;
      closeLibraryEditors("menu");
      state.actionArmed = null;
      state.menuShape = preset.shape;
      if (preset.shape === "free") {
        state.free = preset.items.map((exerciseId) => ({
          key: newSessionKey(),
          exerciseId,
          done: false
        }));
      } else {
        state.menus[preset.shape] = preset.slots.slice();
        deleteShapeChecks(preset.shape);
        if (preset.shape === "ten") state.tenRepeat = preset.tenRepeat === 1 ? 1 : 0;
      }
      flashLibrary("menu", `${preset.name}を呼び出しました`);
      saveMenu();
      if (state.mode === "menu") lead.textContent = menuLead();
      renderMenu();
    }

    function loadTimerPreset(preset) {
      if (timerPresetMatches(preset)) return;
      closeLibraryEditors("timer");
      state.actionArmed = null;
      stopTimer();
      state.clockKind = "tabata";
      workInput.value = String(preset.work);
      restInput.value = String(preset.rest);
      roundInput.value = String(preset.rounds);
      state.session = preset.exercises.map((exerciseId) => ({
        key: newSessionKey(),
        exerciseId,
        done: false
      }));
      state.timer.phase = "idle";
      state.timer.round = 1;
      state.timer.run = null;
      state.timer.remainingMs = openingMs(previewSpec());
      flashLibrary("timer", `${preset.name}を呼び出しました`);
      saveTimer();
      renderSession();
      renderTimer();
    }

    function commitLibrary(mode, overwrite) {
      const ui = state.libraryUi[mode];
      const name = libraryDraftName(mode);
      const showError = (message) => {
        ui.error = message;
        ui.phase = "save";
        state.focusLibrary = mode;
        refreshLibrary(mode);
      };
      if (!name) {
        showError("名前を入力してください");
        return;
      }
      const hasItems = mode === "menu" ? menuHasSelection() : state.session.length > 0;
      if (!hasItems) {
        showError("種目を選んでから保存できます");
        return;
      }
      const list = state.library[mode];
      const existingIndex = list.findIndex((item) => item.name === name);
      if (existingIndex >= 0 && !overwrite) {
        ui.phase = "overwrite";
        ui.error = "";
        refreshLibrary(mode);
        return;
      }
      if (existingIndex < 0 && list.length >= LIBRARY_LIMIT) {
        showError("30件まで保存できます");
        return;
      }
      const body = mode === "menu" ? snapshotMenu() : snapshotTimer();
      const previous = existingIndex >= 0 ? list[existingIndex] : null;
      const preset = { id: previous ? previous.id : newLibraryId(), name, ...body };
      if (existingIndex >= 0) list[existingIndex] = preset;
      else list.push(preset);
      if (!saveLibrary()) {
        if (existingIndex >= 0) list[existingIndex] = previous;
        else list.pop();
        showError("保存できませんでした");
        return;
      }
      closeLibraryEditors(mode);
      flashLibrary(mode, `${name}を保存しました`);
      if (mode === "menu") renderMenu();
      else {
        renderSession();
        renderTimer();
      }
    }

    function deleteLibraryPreset(mode) {
      const ui = state.libraryUi[mode];
      const list = state.library[mode];
      const index = list.findIndex((item) => item.id === ui.deleteId);
      if (index < 0) {
        closeLibraryEditors(mode);
        refreshLibrary(mode);
        return;
      }
      const [removed] = list.splice(index, 1);
      closeLibraryEditors(mode);
      if (!saveLibrary()) {
        list.splice(index, 0, removed);
        ui.phase = "confirm-delete";
        ui.deleteId = removed.id;
        const status = document.getElementById(mode === "menu" ? "menu-status" : "timer-status");
        if (status) {
          status.textContent = "保存できませんでした";
          status.hidden = false;
        }
        refreshLibrary(mode);
        return;
      }
      flashLibrary(mode, `${removed.name}を削除しました`);
      if (mode === "menu") renderMenu();
      else renderSession();
    }

    function onLibraryClick(mode, event) {
      const ui = state.libraryUi[mode];
      if (event.target.closest("[data-library-cancel]")) {
        closeLibraryEditors(mode);
        state.actionArmed = null;
        refreshLibrary(mode);
        return;
      }
      if (event.target.closest("[data-library-commit]")) {
        commitLibrary(mode, false);
        return;
      }
      if (event.target.closest("[data-library-overwrite]")) {
        commitLibrary(mode, true);
        return;
      }
      if (event.target.closest("[data-library-arm-delete]")) {
        closeLibraryEditors(mode);
        ui.phase = "delete";
        state.actionArmed = null;
        refreshLibrary(mode);
        return;
      }
      if (event.target.closest("[data-library-confirm-delete]")) {
        deleteLibraryPreset(mode);
        return;
      }
      const chip = event.target.closest("[data-library-open]");
      if (!chip) return;
      const preset = state.library[mode].find((item) => item.id === chip.dataset.libraryOpen);
      if (!preset) return;
      if (ui.phase === "delete" || ui.phase === "confirm-delete") {
        ui.phase = "confirm-delete";
        ui.deleteId = preset.id;
        refreshLibrary(mode);
        return;
      }
      if (mode === "menu") loadMenuPreset(preset);
      else loadTimerPreset(preset);
    }

    function onLibraryInput(mode, event) {
      const input = event.target;
      if (!input || input.id !== `${mode}-library-name`) return;
      const ui = state.libraryUi[mode];
      const before = ui.phase;
      const hadError = ui.error;
      ui.draft = input.value;
      if (event.isComposing) return;
      if (ui.error) ui.error = "";
      if (ui.phase === "overwrite") {
        const name = normalize(input.value).slice(0, 24);
        if (!state.library[mode].some((item) => item.name === name)) ui.phase = "save";
      }
      if (ui.phase === before && ui.error === hadError) return;
      const caret = input.selectionStart;
      renderWorkoutActions(mode);
      const next = document.getElementById(`${mode}-library-name`);
      if (!next) return;
      next.focus();
      next.setSelectionRange(caret, caret);
    }

    function onLibraryCompositionEnd(mode, event) {
      if (!event.target || event.target.id !== `${mode}-library-name`) return;
      ignoreLibraryEnter = true;
      setTimeout(() => { ignoreLibraryEnter = false; }, 0);
      onLibraryInput(mode, event);
    }

    function onLibraryKeydown(mode, event) {
      if (event.key !== "Enter" || event.target.id !== `${mode}-library-name`) return;
      if (event.isComposing || event.keyCode === 229 || ignoreLibraryEnter) return;
      event.preventDefault();
      commitLibrary(mode, state.libraryUi[mode].phase === "overwrite");
    }

    function stripExerciseFromLibrary(id) {
      let changed = false;
      const menu = [];
      for (const preset of state.library.menu) {
        if (preset.shape === "free") {
          const items = preset.items.filter((item) => item !== id);
          if (items.length === preset.items.length) {
            menu.push(preset);
            continue;
          }
          changed = true;
          if (items.length) menu.push({ ...preset, items });
          continue;
        }
        let touched = false;
        const slots = preset.slots.map((slot) => {
          if (slot !== id) return slot;
          touched = true;
          return null;
        });
        if (!touched) {
          menu.push(preset);
          continue;
        }
        changed = true;
        if (slots.some(Boolean)) menu.push({ ...preset, slots });
      }
      const timer = [];
      for (const preset of state.library.timer) {
        const exercises = preset.exercises.filter((item) => item !== id);
        if (exercises.length === preset.exercises.length) {
          timer.push(preset);
          continue;
        }
        changed = true;
        if (exercises.length) timer.push({ ...preset, exercises });
      }
      if (!changed) return false;
      state.library.menu = menu;
      state.library.timer = timer;
      return true;
    }

    function onWorkoutAction(mode, event) {
      const button = event.target.closest("[data-arm-action]");
      if (!button || button.disabled) return;
      const action = button.dataset.armAction;
      if (action === "save") {
        const ui = state.libraryUi[mode];
        closeLibraryEditors(mode);
        ui.phase = "save";
        state.actionArmed = null;
        state.focusLibrary = mode;
        state.libraryStatus[mode] = "";
        state.libraryHold = null;
        refreshLibrary(mode);
        return;
      }
      if (action === "reset") {
        state.actionArmed = `${mode}-reset`;
        renderWorkoutActions(mode);
        return;
      }
      if (action === "clear") {
        state.actionArmed = `${mode}-clear`;
        renderWorkoutActions(mode);
        return;
      }
      if (action === "cancel") {
        state.actionArmed = null;
        renderWorkoutActions(mode);
        return;
      }
      if (action === "confirm-reset") {
        if (mode === "menu") resetMenuProgress();
        else resetTimerProgress();
        return;
      }
      if (action === "confirm-clear") {
        if (mode === "menu") clearCurrentMenu();
        else clearTimerMenu();
      }
    }

    function renderProgress() {
      if (isFreeMenu()) {
        const done = state.free.filter((item) => item.done).length;
        const total = state.free.length;
        progressLabel.textContent = "種目";
        document.getElementById("progress-count").textContent = total === 0
          ? "0"
          : done === total ? `${total}種目完了` : `${done} / ${total}`;
        document.getElementById("progress-fill").style.width = `${total ? (done / total) * 100 : 0}%`;
        return;
      }
      const shape = shapeOf();
      const prefix = `${state.menuShape}-`;
      const done = Object.entries(state.checks).filter(([key, on]) => on && key.startsWith(prefix)).length;
      const total = shape.performed || shape.count * shape.setsEach;
      const unit = shape.setsEach === 1 ? "種目" : "セット";
      progressLabel.textContent = unit;
      document.getElementById("progress-count").textContent = done === total ? `${total}${unit}完了` : `${done} / ${total}`;
      document.getElementById("progress-fill").style.width = `${total ? (done / total) * 100 : 0}%`;
    }

    function menuCard(id, index, pass) {
      const exercise = exerciseById(id);
      const order = String(index + 1).padStart(2, "0");
      if (!exercise) {
        return `<button type="button" class="empty-slot" data-pick="${index}"><strong>${index + 1}種目目を選ぶ</strong><span>データベースから選びます</span></button>`;
      }
      const sets = state.menuShape === "ten"
        ? [{ key: checkKey("ten", index, pass === 1 ? 1 : 0), label: "終了" }]
        : Array.from({ length: shapeOf().setsEach }, (_, set) => {
          const setsEach = shapeOf().setsEach;
          return {
            key: setsEach === 1 ? checkKey(state.menuShape, index) : checkKey(state.menuShape, index, set),
            label: setsEach === 1 ? "終了" : `セット ${set + 1}`
          };
        });
      const buttons = sets.map((set) => {
        const on = Boolean(state.checks[set.key]);
        return `<button type="button" class="set" data-check="${set.key}" aria-pressed="${on}"><span class="box"></span>${set.label}</button>`;
      }).join("");
      const note = exercise.note ? `<p class="note">${esc(exercise.note)}</p>` : "";
      return `<article class="card">
        <div class="card-top">
          <div>
            <p class="ord">${order}</p>
            <h2>${esc(exercise.name)}</h2>
            <div class="part" style="color:${colorOf(exercise.part)}"><i style="background:${colorOf(exercise.part)}"></i>${esc(exercise.part)}</div>
            ${note}
          </div>
          <button type="button" class="text-btn" data-pick="${index}">変更</button>
        </div>
        <div class="sets">${buttons}</div>
      </article>`;
    }

    function sessionListHtml(items) {
      const rows = items.map((item) => {
        const exercise = exerciseById(item.exerciseId);
        if (!exercise) return "";
        return `<div class="session-item">
          <button type="button" class="session-row" data-session="${esc(item.key)}" aria-pressed="${item.done}">
            <span class="box"></span>
            <span>
              <strong>${esc(exercise.name)}</strong>
              <span class="part" style="color:${item.done ? "inherit" : colorOf(exercise.part)}"><i style="background:${colorOf(exercise.part)}"></i>${esc(exercise.part)}</span>
            </span>
          </button>
          <button type="button" class="text-btn" data-remove="${esc(item.key)}">外す</button>
        </div>`;
      }).join("");
      return rows || `<p class="empty-copy">種目を末尾に追加すると、ここに並びます。</p>`;
    }

    function tenRounds() {
      const front = [0, 1, 2, 3, 4];
      const back = [5, 6, 7, 8, 9];
      if (state.tenRepeat === 1) {
        return [
          { slots: front, pass: 0, note: "" },
          { slots: back, pass: 0, note: "" },
          { slots: back, pass: 1, note: "2セット目と同じ" }
        ];
      }
      return [
        { slots: front, pass: 0, note: "" },
        { slots: front, pass: 1, note: "1セット目と同じ" },
        { slots: back, pass: 0, note: "" }
      ];
    }

    function renderMenu() {
      renderProgress();
      renderLibrary("menu");
      renderWorkoutActions("menu");
      document.getElementById("add-free").hidden = !isFreeMenu();
      document.querySelectorAll("#shape-switch button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.shape === state.menuShape));
      });
      const repeatSwitch = document.getElementById("ten-repeat");
      const showRepeat = state.menuShape === "ten";
      repeatSwitch.hidden = !showRepeat;
      if (showRepeat) {
        repeatSwitch.querySelectorAll("[data-repeat]").forEach((button) => {
          button.setAttribute("aria-pressed", String(Number(button.dataset.repeat) === state.tenRepeat));
        });
      }
      if (isFreeMenu()) {
        menuList.innerHTML = sessionListHtml(state.free);
        return;
      }
      const list = currentMenu();
      if (state.menuShape === "ten") {
        menuList.innerHTML = tenRounds().map((round, group) => {
          const cards = round.slots.map((index) => menuCard(list[index], index, round.pass)).join("");
          const note = round.note ? `<span class="set-note">${esc(round.note)}</span>` : "";
          return `<h3 class="set-heading">${group + 1}セット目${note}</h3>${cards}`;
        }).join("");
        return;
      }
      const groups = shapeOf().groups;
